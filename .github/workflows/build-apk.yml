          test -f app/src/main/java/com/ak/agevaccine/MainActivity.java
          test -f app/src/main/res/drawable/ri_logo.xml
          test -f app/src/main/res/values/themes.xml
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f gradlew

          grep -q "class MainActivity" \
              app/src/main/java/com/ak/agevaccine/MainActivity.java

          grep -q "HPV" \
              app/src/main/java/com/ak/agevaccine/MainActivity.java

          grep -q "calculateAge" \
              app/src/main/java/com/ak/agevaccine/MainActivity.java

          grep -q "applicationId 'com.ak.agevaccine'" \
              app/build.gradle

          echo "All required files verified."
          echo "=========================================="

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          ./gradlew clean assembleDebug --stacktrace

      - name: Verify generated APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "=========================================="
          echo "APK BUILD SUCCESSFUL"
          echo "=========================================="

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Age-Calculator-with-Vaccine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
