          private boolean ageAfter14Within15Years3Months(
                  int years,
                  int months,
                  int days
          ) {

              boolean greaterThan14 =
                      years > 14
                              || (years == 14
                              && (months > 0 || days > 0));

              boolean within15Years3Months =
                      years < 15
                              || (years == 15
                              && months <= 3);

              return greaterThan14
                      && within15Years3Months;
          }

          private void addDue(
                  StringBuilder sb,
                  String vaccine,
                  String when,
                  String dose,
                  String route,
                  String site
          ) {

              sb.append("💉 ")
                      .append(vaccine)
                      .append("\n");

              sb.append("   कब: ")
                      .append(when)
                      .append("\n");

              sb.append("   Dose: ")
                      .append(dose)
                      .append("\n");

              sb.append("   Route: ")
                      .append(route)
                      .append("\n");

              sb.append("   Site: ")
                      .append(site)
                      .append("\n\n");
          }

