      # =========================================================
      # GENERATE GRADLE WRAPPER
      # =========================================================

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -e

          gradle wrapper --gradle-version 8.7

          chmod +x ./gradlew


      # =========================================================
      # VERIFY PROJECT
      # =========================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "======================================"

          test -f app/src/main/java/com/ak/agevaccine/MainActivity.java
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/values/colors.xml
          test -f app/src/main/res/values/themes.xml
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/res/drawable/ic_app.xml
          test -f app/build.gradle
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f gradlew

          echo "All required files are present."
          echo "======================================"


      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          ./gradlew clean assembleDebug --stacktrace


      # =========================================================
      # VERIFY APK
      # =========================================================

      - name: Verify generated APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "======================================"
          echo "APK GENERATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"


            # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Age-Calculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
