              private List<Vaccine> getExpiredVaccines(
                      Age age) {

                  List<Vaccine> all =
                          getDueVaccines(age);

                  List<Vaccine> result =
                          new ArrayList<>();

                  /*
                   * The app intentionally does not display
                   * vaccines whose maximum eligible age has
                   * already passed.
                   *
                   * This list is reserved for informational
                   * display and therefore remains empty unless
                   * a vaccine is explicitly configured as missed.
                   */

                  return result;
              }

              private void weekDue(
                      List<Vaccine> list,
                      String name,
                      int weeks,
                      String max,
                      String dose,
                      String route,
                      String site) {

                  int days =
                          weeks * 7;

                  int current =
                          dob == null
                                  ? 0
                                  : (int)
                                  ((today.getTimeInMillis()
                                          - dob.getTimeInMillis())
                                          /
                                          (24L * 60L * 60L * 1000L));

                  if (current >= days &&
                          current <= 365) {

                      addDue(
                              list,
                              name,
                              weeks + " सप्ताह",
                              max,
                              dose,
                              route,
                              site
                      );
                  }
              }

              private void addDue(
                      List<Vaccine> list,
                      String name,
                      String age,
                      String max,
                      String dose,
                      String route,
                      String site) {

                  list.add(
                          new Vaccine(
                                  name,
                                  age,
                                  max,
                                  dose,
                                  route,
                                  site
                          )
                  );
              }

              private LinearLayout vaccineRow(
                      Vaccine v,
                      boolean missed) {

                  LinearLayout box =
                          new LinearLayout(this);

                  box.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  box.setPadding(
                          dp(10),
                          dp(8),
                          dp(10),
                          dp(8)
                  );

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          missed
                                  ? Color.rgb(
                                  255,
                                  245,
                                  245
                          )
                                  : Color.rgb(
                                  240,
                                  250,
                                  248
                          )
                  );

                  bg.setCornerRadius(dp(10));

                  box.setBackground(bg);

                  box.addView(
                          tv(
                                  (missed ? "⚠️ " : "💉 ")
                                          + v.name,
                                  16,
                                  missed ? RED : TEAL,
                                  true
                          )
                  );

                  box.addView(
                          tv(
                                  "देय उम्र: " + v.age +
                                          "\nMaximum age: " + v.maxAge +
                                          "\nDose: " + v.dose +
                                          "\nRoute: " + v.route +
                                          "\nस्थान: " + v.site,
                                  13,
                                  DARK,
                                  false
                          )
                  );

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -2
                          );

                  p.setMargins(
                          0,
                          dp(4),
                          0,
                          dp(4)
                  );

                  box.setLayoutParams(p);

                  return box;
              }

              private void showTimetable() {

                  if (timetableBox.getVisibility()
                          == View.VISIBLE) {

                      timetableBox.setVisibility(
                              View.GONE
                      );

                      return;
                  }

                  timetableBox.removeAllViews();

                  LinearLayout c = card();

                  c.addView(
                          tv(
                                  "📋 राष्ट्रीय टीकाकरण कार्यक्रम",
                                  18,
                                  TEAL,
                                  true
                          )
                  );

                  c.addView(
                          tv(
                                  "टीका • कब • Dose • Route • स्थान • Maximum age",
                                  13,
                                  DARK,
                                  false
                          )
                  );

                  List<Vaccine> table =
                          timetable();

                  for (Vaccine v : table) {

                      c.addView(
                              vaccineRow(
                                      v,
                                      false
                              )
                      );
                  }

                  timetableBox.addView(c);

                  timetableBox.setVisibility(
                          View.VISIBLE
                  );
              }

