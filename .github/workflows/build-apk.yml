              // =====================================================
              // EXACT DAY WINDOW
              // =====================================================

              private void addDays(
                      List<Vaccine> list,
                      String name,
                      long minimumDays,
                      long maximumDays,
                      String dueAge,
                      String maxAge,
                      String dose,
                      String route,
                      String site,
                      long currentDays) {

                  if (currentDays >= minimumDays
                          && currentDays <= maximumDays) {

                      list.add(
                              new Vaccine(
                                      name,
                                      dueAge,
                                      maxAge,
                                      dose,
                                      route,
                                      site
                              )
                      );
                  }
              }


              // =====================================================
              // CALENDAR AGE WINDOW
              // =====================================================

              private void addCalendarWindow(
                      List<Vaccine> list,
                      String name,
                      int minimumMonths,
                      int maximumMonths,
                      String dueAge,
                      String maxAge,
                      String dose,
                      String route,
                      String site,
                      Age age) {

                  if (age.totalMonths >= minimumMonths
                          && age.totalMonths <= maximumMonths) {

                      list.add(
                              new Vaccine(
                                      name,
                                      dueAge,
                                      maxAge,
                                      dose,
                                      route,
                                      site
                              )
                      );
                  }
              }


