                                  initial.get(
                                          Calendar.YEAR
                                  ),
                                  initial.get(
                                          Calendar.MONTH
                                  ),
                                  initial.get(
                                          Calendar.DAY_OF_MONTH
                                  )
                          );

                  dialog.getDatePicker()
                          .setMaxDate(
                                  Calendar.getInstance()
                                          .getTimeInMillis()
                          );

                  dialog.show();
              }

              private String formatDate(
                      Calendar date) {

                  return new SimpleDateFormat(
                          "dd-MM-yyyy",
                          Locale.getDefault()
                  ).format(date.getTime());
              }
