              // =====================================================
              // EXACT DAY WINDOW
              // =====================================================

              private void addCalendarWindowFromBirth(
                      List<Vaccine> list,
                      String name,
                      int maximumMonths,
                      String dueAge,
                      String maxAge,
                      String dose,
                      String route,
                      String site) {

                  Calendar current = dateOnly(today);
                  Calendar start = dateOnly(dob);
                  Calendar maximumDate = addMonthsSafe(dob, maximumMonths);

                  if (!current.before(start) && !current.after(maximumDate)) {
                      list.add(new Vaccine(name, dueAge, maxAge, dose, route, site));
                  }
              }


              private void addBirthWindow(
                      List<Vaccine> list,
                      String name,
                      int allowedDays,
                      int maximumYears,
                      String dueAge,
                      String maxAge,
                      String dose,
                      String route,
                      String site) {

                  Calendar start = dateOnly(dob);
                  Calendar end = (Calendar) start.clone();
                  end.add(Calendar.DAY_OF_MONTH, allowedDays);

                  Calendar current = dateOnly(today);
                  Calendar maximumDate = addYearsSafe(dob, maximumYears);

                  if (!current.before(start)
                          && !current.after(end)
                          && !current.after(maximumDate)) {

                      list.add(
                              new Vaccine(
                                      name, dueAge, maxAge, dose, route, site
                              )
                      );
                  }
              }


              private void addCompletedDays(
                      List<Vaccine> list,
                      String name,
                      long completedDays,
                      int maximumYears,
                      String dueAge,
                      String maxAge,
                      String dose,
                      String route,
                      String site,
                      long currentDays) {

                  /*
                   * Exact rule:
                   *
                   * 42 days COMPLETE -> vaccine is due on day 43.
                   * 70 days COMPLETE -> vaccine is due on day 71.
                   * 98 days COMPLETE -> vaccine is due on day 99.
                   *
                   * The due date is therefore calculated directly from DOB,
                   * rather than treating 42/70/98 as the first due day.
                   */
                  Calendar dueStart = dateOnly(dob);
                  dueStart.add(
                          Calendar.DAY_OF_MONTH,
                          (int) completedDays + 1
                  );

                  Calendar maximumDate =
                          addYearsSafe(dob, maximumYears);

                  Calendar current = dateOnly(today);

                  if (!current.before(dueStart)
                          && !current.after(maximumDate)) {

                      list.add(
                              new Vaccine(
                                      name,
                                      dueAge,
                                      maxAge,
                                      dose,
                                      route,
                                      site
                              )
                      );
                  }
              }


              // =====================================================
              // CALENDAR AGE WINDOW
              // =====================================================

              private void addCalendarWindow(
                      List<Vaccine> list,
                      String name,
                      int minimumMonths,
                      int maximumMonths,
                      String dueAge,
                      String maxAge,
                      String dose,
                      String route,
                      String site) {

                  Calendar minimumComplete = addMonthsSafe(dob, minimumMonths);
                  Calendar dueStart = (Calendar) minimumComplete.clone();
                  dueStart.add(Calendar.DAY_OF_MONTH, 1);

                  Calendar maximumComplete = addMonthsSafe(dob, maximumMonths);

                  Calendar current = dateOnly(today);

                  if (!current.before(dueStart) && !current.after(maximumComplete)) {
                      list.add(new Vaccine(name, dueAge, maxAge, dose, route, site));
                  }
              }


