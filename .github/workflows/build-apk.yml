name: Build Age Calculator with Vaccine APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create project folders
        shell: bash
        run: |
          set -e

          rm -rf app

          mkdir -p app/src/main/java/com/ak/agevaccine
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Age Calculator with Vaccine"

          include(":app")
          EOF

      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Create app build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ak.agevaccine'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.ak.agevaccine'

                  minSdk 23
                  targetSdk 35

                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Create strings.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>
              <string name="app_name">आयु एवं टीका सहायक</string>
          </resources>
          EOF

      - name: Create themes.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="Theme.AgeVaccine"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">#00A896</item>

                  <item name="android:statusBarColor">#004D40</item>

                  <item name="android:navigationBarColor">#004D40</item>

                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

      - name: Create vaccine icon
        shell: bash
        run: |
          cat > app/src/main/res/drawable/ic_vaccine.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M7,35 L19,23 L25,29 L13,41 Z"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M18,24 L29,13 L35,19 L24,30 Z"/>

              <path
                  android:fillColor="#00A896"
                  android:pathData="M27,12 L34,5 L43,14 L36,21 Z"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M10,38 L5,43 L7,45 L12,40 Z"/>

          </vector>
          EOF

      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_vaccine"
                  android:theme="@style/Theme.AgeVaccine">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN"/>

                          <category
                              android:name="android.intent.category.LAUNCHER"/>

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF
                - name: Create MainActivity part 1
        shell: bash
        run: |
          cat > app/src/main/java/com/ak/agevaccine/MainActivity.java <<'EOF'
          package com.ak.agevaccine;

          import android.app.Activity;
          import android.app.DatePickerDialog;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private LinearLayout root;
              private LinearLayout resultBox;

              private EditText dobInput;
              private EditText todayInput;
              private Spinner genderSpinner;

              private TextView ageResult;
              private TextView dueResult;

              private final int TEAL = Color.rgb(0, 137, 123);
              private final int DARK = Color.rgb(0, 77, 64);
              private final int LIGHT = Color.rgb(232, 245, 243);
              private final int TEXT = Color.rgb(35, 45, 50);
              private final int WHITE = Color.WHITE;

              private final Calendar today = Calendar.getInstance();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  buildInterface();
              }

              private void buildInterface() {

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(246, 249, 248));

                  root.addView(createHeader());

                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);

                  LinearLayout content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(dp(16), dp(14), dp(16), dp(30));

                  content.addView(createIntroCard());

                  content.addView(createInputCard());

                  resultBox = new LinearLayout(this);
                  resultBox.setOrientation(LinearLayout.VERTICAL);
                  resultBox.setVisibility(View.GONE);

                  content.addView(resultBox);

                  LinearLayout.LayoutParams scrollParams =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          );

                  scroll.addView(content);

                  root.addView(scroll, scrollParams);

                  setContentView(root);
              }

              private View createHeader() {

                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  header.setPadding(dp(16), dp(12), dp(16), dp(12));
                  header.setBackgroundColor(DARK);

                  TextView icon = new TextView(this);
                  icon.setText("💉");
                  icon.setTextSize(30);
                  icon.setGravity(Gravity.CENTER);

                  header.addView(
                          icon,
                          new LinearLayout.LayoutParams(
                                  dp(48),
                                  dp(48)
                          )
                  );

                  LinearLayout titles = new LinearLayout(this);
                  titles.setOrientation(LinearLayout.VERTICAL);
                  titles.setPadding(dp(10), 0, 0, 0);

                  TextView title = text(
                          "आयु एवं टीका सहायक",
                          20,
                          WHITE,
                          true
                  );

                  TextView subtitle = text(
                          "Age Calculator • Vaccine Due",
                          12,
                          Color.rgb(200, 235, 230),
                          false
                  );

                  titles.addView(title);
                  titles.addView(subtitle);

                  header.addView(
                          titles,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1
                          )
                  );

                  Button tableButton = smallButton("📋");

                  tableButton.setContentDescription(
                          "टीकाकरण टाइम टेबल"
                  );

                  tableButton.setOnClickListener(
                          v -> showVaccinationTable()
                  );

                  header.addView(tableButton);

                  return header;
              }

              private View createIntroCard() {

                  LinearLayout card = card();

                  TextView title = text(
                          "👶 व्यक्ति की आयु और टीका स्थिति",
                          18,
                          DARK,
                          true
                  );

                  TextView info = text(
                          "जन्म तिथि और गणना की तारीख दर्ज करें। "
                          + "ऐप आयु वर्ष + माह + दिन में बताएगा "
                          + "और आयु के अनुसार देय टीकों की सूची दिखाएगा।",
                          14,
                          TEXT,
                          false
                  );

                  info.setPadding(0, dp(8), 0, 0);

                  card.addView(title);
                  card.addView(info);

                  return card;
              }

              private View createInputCard() {

                  LinearLayout card = card();

                  TextView heading = text(
                          "जानकारी दर्ज करें",
                          18,
                          DARK,
                          true
                  );

                  card.addView(heading);

                  TextView genderLabel = label("लिंग");

                  card.addView(genderLabel);

                  genderSpinner = new Spinner(this);

                  String[] genders = {
                          "Female / महिला",
                          "Male / पुरुष"
                  };

                  ArrayAdapter<String> adapter =
                          new ArrayAdapter<String>(
                                  this,
                                  android.R.layout.simple_spinner_dropdown_item,
                                  genders
                          );

                  genderSpinner.setAdapter(adapter);

                  card.addView(
                          genderSpinner,
                          fieldParams()
                  );

                  TextView dobLabel = label(
                          "जन्म तिथि (DD/MM/YYYY)"
                  );

                  card.addView(dobLabel);

                  dobInput = dateField(
                          "जन्म तिथि चुनें या टाइप करें"
                  );

                  card.addView(
                          dobInput,
                          fieldParams()
                  );

                  TextView todayLabel = label(
                          "गणना की तारीख (DD/MM/YYYY)"
                  );

                  card.addView(todayLabel);

                  todayInput = dateField(
                          "आज की तारीख चुनें या टाइप करें"
                  );

                  todayInput.setText(
                          formatDate(today)
                  );

                  card.addView(
                          todayInput,
                          fieldParams()
                  );

                  Button calculate = new Button(this);

                  calculate.setText("✓  आयु एवं टीका जांचें");
                  calculate.setTextSize(16);
                  calculate.setTextColor(WHITE);
                  calculate.setAllCaps(false);
                  calculate.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  GradientDrawable buttonBg =
                          rounded(TEAL, 18);

                  calculate.setBackground(buttonBg);

                  calculate.setPadding(
                          dp(12),
                          dp(10),
                          dp(12),
                          dp(10)
                  );

                  calculate.setOnClickListener(
                          v -> calculateAndShow()
                  );

                  LinearLayout.LayoutParams bp =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(54)
                          );

                  bp.topMargin = dp(18);

                  card.addView(calculate, bp);

                  Button timetable = new Button(this);

                  timetable.setText(
                          "📋  पूरा Vaccination Time Table"
                  );

                  timetable.setTextSize(15);
                  timetable.setAllCaps(false);
                  timetable.setTextColor(DARK);

                  timetable.setOnClickListener(
                          v -> showVaccinationTable()
                  );

                  card.addView(
                          timetable,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(52)
                          )
                  );

                  return card;
              }

              private EditText dateField(String hint) {

                  EditText e = new EditText(this);

                  e.setHint(hint);
                  e.setTextSize(15);
                  e.setSingleLine(true);
                  e.setPadding(
                          dp(14),
                          0,
                          dp(14),
                          0
                  );

                  e.setBackground(
                          rounded(Color.WHITE, 14)
                  );

                  e.setCompoundDrawablesWithIntrinsicBounds(
                          android.R.drawable.ic_menu_my_calendar,
                          0,
                          0,
                          0
                  );

                  e.setCompoundDrawablePadding(dp(10));

                  e.setOnClickListener(
                          v -> openDatePicker(e)
                  );

                  return e;
              }
              EOF
                    - name: Create MainActivity part 2
        shell: bash
        run: |
          cat >> app/src/main/java/com/ak/agevaccine/MainActivity.java <<'EOF'

          private void openDatePicker(EditText target) {

              Calendar selected = Calendar.getInstance();

              Calendar parsed = parseDate(target.getText().toString());

              if (parsed != null) {
                  selected = parsed;
              }

              DatePickerDialog dialog =
                      new DatePickerDialog(
                              this,
                              (view, year, month, day) -> {

                                  Calendar c = Calendar.getInstance();

                                  c.set(
                                          year,
                                          month,
                                          day
                                  );

                                  target.setText(
                                          formatDate(c)
                                  );
                              },
                              selected.get(
                                      Calendar.YEAR
                              ),
                              selected.get(
                                      Calendar.MONTH
                              ),
                              selected.get(
                                      Calendar.DAY_OF_MONTH
                              )
                      );

              dialog.show();
          }

          private void calculateAndShow() {

              Calendar dob =
                      parseDate(
                              dobInput.getText().toString()
                      );

              Calendar calcDate =
                      parseDate(
                              todayInput.getText().toString()
                      );

              if (dob == null || calcDate == null) {

                  Toast.makeText(
                          this,
                          "कृपया दोनों तारीख सही DD/MM/YYYY में दर्ज करें।",
                          Toast.LENGTH_LONG
                  ).show();

                  return;
              }

              if (dob.after(calcDate)) {

                  Toast.makeText(
                          this,
                          "जन्म तिथि गणना की तारीख से आगे नहीं हो सकती।",
                          Toast.LENGTH_LONG
                  ).show();

                  return;
              }

              int[] age = calculateAge(
                      dob,
                      calcDate
              );

              int years = age[0];
              int months = age[1];
              int days = age[2];

              resultBox.removeAllViews();
              resultBox.setVisibility(View.VISIBLE);

              LinearLayout ageCard = card();

              TextView heading = text(
                      "🎯 गणना का परिणाम",
                      18,
                      DARK,
                      true
              );

              ageCard.addView(heading);

              TextView ageText = text(
                      years + " वर्ष  " +
                      months + " माह  " +
                      days + " दिन",
                      25,
                      TEAL,
                      true
              );

              ageText.setGravity(Gravity.CENTER);

              ageCard.addView(
                      ageText,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(70)
                      )
              );

              TextView dobText = text(
                      "जन्म तिथि : "
                              + dobInput.getText().toString()
                              + "\nगणना तिथि : "
                              + todayInput.getText().toString(),
                      13,
                      Color.DKGRAY,
                      false
              );

              ageCard.addView(dobText);

              resultBox.addView(ageCard);

              showDueVaccines(
                      years,
                      months,
                      days,
                      dob,
                      calcDate
              );
          }

          private int[] calculateAge(
                  Calendar dob,
                  Calendar current
          ) {

              Calendar start =
                      (Calendar) dob.clone();

              Calendar end =
                      (Calendar) current.clone();

              int years =
                      end.get(Calendar.YEAR)
                              - start.get(Calendar.YEAR);

              Calendar anniversary =
                      (Calendar) start.clone();

              anniversary.add(
                      Calendar.YEAR,
                      years
              );

              if (anniversary.after(end)) {

                  years--;

                  anniversary =
                          (Calendar) start.clone();

                  anniversary.add(
                          Calendar.YEAR,
                          years
                  );
              }

              int months = 0;

              Calendar monthPoint =
                      (Calendar) anniversary.clone();

              while (true) {

                  Calendar next =
                          (Calendar) monthPoint.clone();

                  next.add(
                          Calendar.MONTH,
                          1
                  );

                  if (next.after(end)) {
                      break;
                  }

                  monthPoint = next;
                  months++;
              }

              long diff =
                      end.getTimeInMillis()
                              - monthPoint.getTimeInMillis();

              int days =
                      (int) (
                              diff
                              / (24L * 60L * 60L * 1000L)
                      );

              return new int[]{
                      years,
                      months,
                      days
              };
          }

          private Calendar parseDate(String value) {

              if (value == null ||
                      value.trim().isEmpty()) {
                  return null;
              }

              try {

                  SimpleDateFormat sdf =
                          new SimpleDateFormat(
                                  "dd/MM/yyyy",
                                  Locale.ENGLISH
                          );

                  sdf.setLenient(false);

                  Date d =
                          sdf.parse(value.trim());

                  Calendar c =
                          Calendar.getInstance();

                  c.setTime(d);

                  c.set(
                          Calendar.HOUR_OF_DAY,
                          12
                  );

                  c.set(
                          Calendar.MINUTE,
                          0
                  );

                  c.set(
                          Calendar.SECOND,
                          0
                  );

                  c.set(
                          Calendar.MILLISECOND,
                          0
                  );

                  return c;

              } catch (Exception e) {

                  return null;
              }
          }

          private String formatDate(Calendar c) {

              SimpleDateFormat sdf =
                      new SimpleDateFormat(
                              "dd/MM/yyyy",
                              Locale.ENGLISH
                      );

              return sdf.format(
                      c.getTime()
              );
          }

          private long ageInDays(
                  Calendar dob,
                  Calendar today
          ) {

              Calendar a =
                      (Calendar) dob.clone();

              Calendar b =
                      (Calendar) today.clone();

              a.set(
                      Calendar.HOUR_OF_DAY,
                      12
              );

              b.set(
                      Calendar.HOUR_OF_DAY,
                      12
              );

              return (
                      b.getTimeInMillis()
                      - a.getTimeInMillis()
              ) / (24L * 60L * 60L * 1000L);
          }

          private boolean femaleSelected() {

              return genderSpinner
                      .getSelectedItemPosition()
                      == 0;
          }

          private boolean ageAtLeast(
                  int years,
                  int months,
                  int days,
                  int y,
                  int m
          ) {

              if (years > y) {
                  return true;
              }

              if (years < y) {
                  return false;
              }

              return months >= m;
          }

          private boolean ageAtMost(
                  int years,
                  int months,
                  int days,
                  int y,
                  int m
          ) {

              if (years < y) {
                  return true;
              }

              if (years > y) {
                  return false;
              }

              return months < m
                      || (months == m && days == 0)
                      || months == m;
          }
           EOF
                 - name: Create MainActivity part 3
        shell: bash
        run: |
          cat >> app/src/main/java/com/ak/agevaccine/MainActivity.java <<'EOF'

          private void showDueVaccines(
                  int years,
                  int months,
                  int days,
                  Calendar dob,
                  Calendar today
          ) {

              LinearLayout card = card();

              TextView heading = text(
                      "💉 आयु के अनुसार देय / लंबित टीके",
                      18,
                      DARK,
                      true
              );

              card.addView(heading);

              TextView note = text(
                      "नोट: यह सूची केवल आयु के आधार पर है। "
                      + "यदि कोई टीका पहले लग चुका है तो उसे दोबारा "
                      + "देय न मानें। टीकाकरण रिकॉर्ड अवश्य मिलाएं।",
                      12,
                      Color.DKGRAY,
                      false
              );

              note.setPadding(
                      0,
                      dp(8),
                      0,
                      dp(10)
              );

              card.addView(note);

              StringBuilder result =
                      new StringBuilder();

              long totalDays =
                      ageInDays(dob, today);

              // Birth vaccines
              if (totalDays <= 1) {

                  addDue(
                          result,
                          "Hepatitis-B Birth Dose",
                          "जन्म के समय / 24 घंटे के भीतर",
                          "0.5 ml",
                          "IM",
                          "जांघ का antero-lateral भाग"
                  );
              }

              if (totalDays <= 15) {

                  addDue(
                          result,
                          "OPV-0",
                          "जन्म के समय / पहले 15 दिन",
                          "2 drops",
                          "Oral",
                          "मुंह"
                  );
              }

              if (totalDays <= 365) {

                  addDue(
                          result,
                          "BCG",
                          "जन्म से 1 वर्ष तक",
                          "0.05 ml (<1 माह), फिर 0.1 ml",
                          "Intradermal",
                          "बायां ऊपरी बाजू"
                  );
              }

              // 6 week vaccines
              if (totalDays >= 42) {

                  addDue(
                          result,
                          "OPV-1",
                          "6 सप्ताह",
                          "2 drops",
                          "Oral",
                          "मुंह"
                  );

                  addDue(
                          result,
                          "Pentavalent-1",
                          "6 सप्ताह",
                          "0.5 ml",
                          "IM",
                          "जांघ का antero-lateral भाग"
                  );

                  addDue(
                          result,
                          "Rotavirus-1",
                          "6 सप्ताह",
                          "5 drops*",
                          "Oral",
                          "मुंह"
                  );

                  addDue(
                          result,
                          "fIPV-1",
                          "6 सप्ताह",
                          "0.1 ml",
                          "Intradermal",
                          "दायां ऊपरी बाजू"
                  );

                  addDue(
                          result,
                          "PCV-1",
                          "6 सप्ताह",
                          "0.5 ml",
                          "IM",
                          "जांघ का antero-lateral भाग"
                  );
              }

              // 10 week vaccines
              if (totalDays >= 70) {

                  addDue(
                          result,
                          "OPV-2",
                          "10 सप्ताह",
                          "2 drops",
                          "Oral",
                          "मुंह"
                  );

                  addDue(
                          result,
                          "Pentavalent-2",
                          "10 सप्ताह",
                          "0.5 ml",
                          "IM",
                          "जांघ का antero-lateral भाग"
                  );

                  addDue(
                          result,
                          "Rotavirus-2",
                          "10 सप्ताह",
                          "5 drops*",
                          "Oral",
                          "मुंह"
                  );
              }

              // 14 week vaccines
              if (totalDays >= 98) {

                  addDue(
                          result,
                          "OPV-3",
                          "14 सप्ताह",
                          "2 drops",
                          "Oral",
                          "मुंह"
                  );

                  addDue(
                          result,
                          "Pentavalent-3",
                          "14 सप्ताह",
                          "0.5 ml",
                          "IM",
                          "जांघ का antero-lateral भाग"
                  );

                  addDue(
                          result,
                          "Rotavirus-3",
                          "14 सप्ताह",
                          "5 drops*",
                          "Oral",
                          "मुंह"
                  );

                  addDue(
                          result,
                          "fIPV-2",
                          "14 सप्ताह",
                          "0.1 ml",
                          "Intradermal",
                          "दायां ऊपरी बाजू"
                  );

                  addDue(
                          result,
                          "PCV-2",
                          "14 सप्ताह",
                          "0.5 ml",
                          "IM",
                          "जांघ का antero-lateral भाग"
                  );
              }

              // 9 months
              if (ageAtLeast(
                      years, months, days, 0, 9
              )) {

                  if (years == 0 ||
                          years == 1 ||
                          years < 5) {

                      addDue(
                              result,
                              "MR-1",
                              "9–12 माह",
                              "0.5 ml",
                              "Sub-cutaneous",
                              "दायां ऊपरी बाजू"
                      );

                      addDue(
                              result,
                              "Vitamin-A 1st",
                              "9 माह",
                              "1 ml (1 lakh IU)",
                              "Oral",
                              "मुंह"
                      );

                      addDue(
                              result,
                              "PCV Booster",
                              "9–12 माह",
                              "0.5 ml",
                              "IM",
                              "जांघ का antero-lateral भाग"
                      );
                  }

                  addDue(
                          result,
                          "JE-1*",
                          "9–12 माह",
                          "0.5 ml",
                          "Sub-cutaneous",
                          "बायां ऊपरी बाजू"
                  );
              }

              // 16-24 months
              if (ageAtLeast(
                      years, months, days, 1, 4
              )) {

                  addDue(
                          result,
                          "DPT Booster-1",
                          "16–24 माह",
                          "0.5 ml",
                          "IM",
                          "जांघ का antero-lateral भाग"
                  );

                  addDue(
                          result,
                          "MR-2",
                          "16–24 माह",
                          "0.5 ml",
                          "Sub-cutaneous",
                          "दायां ऊपरी बाजू"
                  );

                  addDue(
                          result,
                          "OPV Booster",
                          "16–24 माह",
                          "2 drops",
                          "Oral",
                          "मुंह"
                  );

                  addDue(
                          result,
                          "JE-2*",
                          "16–24 माह",
                          "0.5 ml",
                          "Sub-cutaneous",
                          "बायां ऊपरी बाजू"
                  );

                  addDue(
                          result,
                          "Vitamin-A",
                          "16 माह से हर 6 माह",
                          "2 ml (2 lakh IU)",
                          "Oral",
                          "मुंह"
                  );
              }

              // DPT booster 2
              if (ageAtLeast(
                      years, months, days, 5, 0
              ) && years <= 7) {

                  addDue(
                          result,
                          "DPT Booster-2",
                          "5–6 वर्ष",
                          "0.5 ml",
                          "IM",
                          "ऊपरी बाजू"
                  );
              }

              // Td at 10 years
              if (ageAtLeast(
                      years, months, days, 10, 0
              ) && years < 16) {

                  addDue(
                          result,
                          "Td",
                          "10 वर्ष",
                          "0.5 ml",
                          "IM",
                          "ऊपरी बाजू"
                  );
              }

              // Td at 16 years
              if (ageAtLeast(
                      years, months, days, 16, 0
              )) {

                  addDue(
                          result,
                          "Td",
                          "16 वर्ष",
                          "0.5 ml",
                          "IM",
                          "ऊपरी बाजू"
                  );
              }

              // User requested HPV rule
              if (femaleSelected()
                      && ageAfter14Within15Years3Months(
                              years,
                              months,
                              days
                      )) {

                  addDue(
                          result,
                          "HPV Vaccine ⭐",
                          "आपके दिए नियम के अनुसार: "
                                  + "14 वर्ष से 15 वर्ष 3 माह तक",
                          "Guideline के अनुसार",
                          "Guideline के अनुसार",
                          "Guideline के अनुसार"
                  );
              }

              if (result.length() == 0) {

                  TextView none = text(
                          "इस आयु के लिए ऊपर दिए गए नियमों के अनुसार "
                                  + "कोई नया age-based due item नहीं मिला।\n\n"
                                  + "यदि कोई पिछली dose छूटी है तो "
                                  + "vaccination record के आधार पर catch-up "
                                  + "की आवश्यकता अलग से तय होगी।",
                          14,
                          TEXT,
                          false
                  );

                  card.addView(none);

              } else {

                  TextView list = text(
                          result.toString(),
                          14,
                          TEXT,
                          false
                  );

                  list.setLineSpacing(
                          dp(4),
                          1.0f
                  );

                  card.addView(list);
              }

              TextView foot = text(
                      "\n* JE केवल लागू क्षेत्र/जिले में।\n"
                              + "* Rotavirus/PCV का उपयोग संबंधित "
                              + "कार्यक्रमीय प्रावधान के अनुसार।\n"
                              + "* यह age-based सहायता है; "
                              + "अंतिम निर्णय अधिकृत immunization "
                              + "guideline और रिकॉर्ड के अनुसार करें।",
                      11,
                      Color.DKGRAY,
                      false
              );

              card.addView(foot);

              resultBox.addView(card);
          }
         EOF
