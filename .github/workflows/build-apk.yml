              private void calculate() {

                  if (dob == null) {

                      Toast.makeText(
                              this,
                              "कृपया जन्म तिथि चुनें",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  if (dob.after(today)) {

                      Toast.makeText(
                              this,
                              "जन्म तिथि आज से आगे नहीं हो सकती",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  Age age =
                          getAge(dob, today);

                  resultBox.removeAllViews();

                  resultBox.setVisibility(
                          View.VISIBLE
                  );

                  LinearLayout ageCard = card();

                  ageCard.addView(
                          txt(
                                  "वर्तमान आयु",
                                  18,
                                  DARK,
                                  true
                          )
                  );

                  TextView ageValue =
                          txt(
                                  age.years
                                          + " वर्ष "
                                          + age.months
                                          + " माह "
                                          + age.days
                                          + " दिन",
                                  25,
                                  TEAL,
                                  true
                          );

                  ageValue.setGravity(
                          Gravity.CENTER
                  );

                  ageCard.addView(ageValue);

                  resultBox.addView(ageCard);

                  boolean female =
                          genderGroup
                                  .getCheckedRadioButtonId()
                                  == genderGroup
                                  .getChildAt(1)
                                  .getId();

                  List<Vaccine> due =
                          getDueVaccines(age);

                  LinearLayout dueCard = card();

                  dueCard.addView(
                          txt(
                                  "💉 अभी देय / लंबित टीके",
                                  18,
                                  TEAL,
                                  true
                          )
                  );

                  if (due.isEmpty()) {

                      dueCard.addView(
                              txt(
                                      "इस आयु पर कोई टीका देय नहीं है।",
                                      15,
                                      Color.rgb(
                                              46,
                                              125,
                                              50
                                      ),
                                      true
                              )
                      );

                  } else {

                      for (Vaccine v : due) {
                          dueCard.addView(
                                  vaccineRow(v)
                          );
                      }
                  }

                  resultBox.addView(dueCard);

                  if (female &&
                          isHpvEligible()) {

                      LinearLayout hpv =
                              card();

                      hpv.addView(
                              txt(
                                      "💗 HPV टीका",
                                      18,
                                      PINK,
                                      true
                              )
                      );

                      hpv.addView(
                              txt(
                                      "महिला लाभार्थी HPV टीके के लिए पात्र है।",
                                      14,
                                      DARK,
                                      false
                              )
                      );

                      hpv.addView(
                              txt(
                                      "पात्रता: 14 वर्ष + 1 दिन से 15 वर्ष 3 माह तक",
                                      14,
                                      PINK,
                                      true
                              )
                      );

                      resultBox.addView(hpv);
                  }
              }

              private Age getAge(
                      Calendar birth,
                      Calendar end) {

                  Calendar temp =
                          (Calendar) birth.clone();

                  int years = 0;

                  while (true) {

                      Calendar next =
                              (Calendar) temp.clone();

                      next.add(
                              Calendar.YEAR,
                              1
                      );

                      if (next.after(end)) {
                          break;
                      }

                      temp = next;
                      years++;
                  }

                  int months = 0;

                  while (true) {

                      Calendar next =
                              (Calendar) temp.clone();

                      next.add(
                              Calendar.MONTH,
                              1
                      );

                      if (next.after(end)) {
                          break;
                      }

                      temp = next;
                      months++;
                  }

                  long milliseconds =
                          end.getTimeInMillis()
                                  - temp.getTimeInMillis();

                  int days =
                          (int) (
                                  milliseconds
                                          / (
                                          24L
                                                  * 60L
                                                  * 60L
                                                  * 1000L
                                  )
                          );

                  long totalDays =
                          (
                                  end.getTimeInMillis()
                                          - birth.getTimeInMillis()
                          )
                                  / (
                                  24L
                                          * 60L
                                          * 60L
                                          * 1000L
                          );

                  return new Age(
                          years,
                          months,
                          days,
                          totalDays
                  );
              }

              private boolean isHpvEligible() {

                  Calendar start =
                          (Calendar) dob.clone();

                  start.add(
                          Calendar.YEAR,
                          14
                  );

                  start.add(
                          Calendar.DAY_OF_MONTH,
                          1
                  );

                  Calendar end =
                          (Calendar) dob.clone();

                  end.add(
                          Calendar.YEAR,
                          15
                  );

                  end.add(
                          Calendar.MONTH,
                          3
                  );

                  return !today.before(start)
                          && !today.after(end);
              }

              private List<Vaccine>
              getDueVaccines(Age age) {

