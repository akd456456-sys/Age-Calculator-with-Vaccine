              static class Age {

                  int years;
                  int months;
                  int days;
                  long totalDays;

                  Age(
                          int years,
                          int months,
                          int days,
                          long totalDays) {

                      this.years = years;
                      this.months = months;
                      this.days = days;
                      this.totalDays = totalDays;
                  }

                  int totalMonths() {
                      return years * 12 + months;
                  }
              }

              static class Vaccine {

                  String name;
                  String dueAge;
                  String maxAge;
                  String dose;
                  String route;
                  String site;

                  Vaccine(
                          String name,
                          String dueAge,
                          String maxAge,
                          String dose,
                          String route,
                          String site) {

                      this.name = name;
                      this.dueAge = dueAge;
                      this.maxAge = maxAge;
                      this.dose = dose;
                      this.route = route;
                      this.site = site;
                  }
              }

