              static class Age {

                  int years;

                  int months;

                  int days;

                  int totalMonths;

                  Age(
                          int years,
                          int months,
                          int days,
                          int totalMonths) {

                      this.years = years;

                      this.months = months;

                      this.days = days;

                      this.totalMonths =
                              totalMonths;
                  }

                  int totalDaysApprox() {

                      return years * 365
                              + months * 30
                              + days;
                  }
              }

              static class Vaccine {

                  String name;

                  String dueAge;

                  String maxAge;

                  String dose;

                  String route;

                  String site;

                  Vaccine(
                          String name,
                          String dueAge,
                          String maxAge,
                          String dose,
                          String route,
                          String site) {

                      this.name = name;

                      this.dueAge = dueAge;

                      this.maxAge = maxAge;

                      this.dose = dose;

                      this.route = route;

                      this.site = site;
                  }
              }
          }
