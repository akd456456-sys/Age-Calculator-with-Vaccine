                  int months;

                  int days;

                  long totalDays;

                  int totalMonths;


                  Age(
                          int years,
                          int months,
                          int days,
                          long totalDays) {

                      this.years = years;

                      this.months = months;

                      this.days = days;

                      this.totalDays =
                              totalDays;

                      this.totalMonths =
                              years * 12
                                      + months;
                  }
              }


              // =====================================================
              // VACCINE CLASS
              // =====================================================

              static class Vaccine {

                  String name;

                  String dueAge;

                  String maxAge;

                  String dose;

                  String route;

                  String site;


                  Vaccine(
                          String name,
                          String dueAge,
                          String maxAge,
                          String dose,
                          String route,
                          String site) {

                      this.name = name;

                      this.dueAge = dueAge;

                      this.maxAge = maxAge;

                      this.dose = dose;

                      this.route = route;

                      this.site = site;
                  }
              }

          }
          EOF


      # =========================================================
      # GRADLE WRAPPER
      # =========================================================

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.7


      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace


      # =========================================================
      # VERIFY APK
      # =========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -f app/build/outputs/apk/debug/app-debug.apk

          ls -lh \
            app/build/outputs/apk/debug/app-debug.apk


      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Age-Calculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
   
