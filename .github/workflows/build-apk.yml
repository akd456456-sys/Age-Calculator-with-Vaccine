              private void addDays(
                      List<Vaccine> list,
                      String name,
                      long minimum,
                      long maximum,
                      String dueAge,
                      String maxAge,
                      String dose,
                      String route,
                      String site,
                      long currentDays) {

                  if (currentDays >= minimum
                          && currentDays <= maximum) {

                      list.add(
                              new Vaccine(
                                      name,
                                      dueAge,
                                      maxAge,
                                      dose,
                                      route,
                                      site
                              )
                      );
                  }
              }

              private void addMonths(
                      List<Vaccine> list,
                      String name,
                      int minimum,
                      int maximum,
                      String dueAge,
                      String maxAge,
                      String dose,
                      String route,
                      String site,
                      int currentMonths) {

                  if (currentMonths >= minimum
                          && currentMonths <= maximum) {

                      list.add(
                              new Vaccine(
                                      name,
                                      dueAge,
                                      maxAge,
                                      dose,
                                      route,
                                      site
                              )
                      );
                  }
              }

              private LinearLayout vaccineRow(
                      Vaccine v) {

                  LinearLayout box =
                          new LinearLayout(this);

                  box.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  box.setPadding(
                          dp(10),
                          dp(8),
                          dp(10),
                          dp(8)
                  );

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(
                                  240,
                                  250,
                                  248
                          )
                  );

                  bg.setCornerRadius(dp(10));

                  box.setBackground(bg);

                  box.addView(
                          txt(
                                  "💉 " + v.name,
                                  16,
                                  TEAL,
                                  true
                          )
                  );

                  box.addView(
                          txt(
                                  "देय उम्र: " + v.dueAge
                                          + "\nMaximum age: "
                                          + v.maxAge
                                          + "\nDose: " + v.dose
                                          + "\nRoute: " + v.route
                                          + "\nस्थान: " + v.site,
                                  13,
                                  DARK,
                                  false
                          )
                  );

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -2
                          );

                  p.setMargins(
                          0,
                          dp(4),
                          0,
                          dp(4)
                  );

                  box.setLayoutParams(p);

                  return box;
              }
