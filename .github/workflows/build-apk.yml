          private LinearLayout card() {

              LinearLayout box =
                      new LinearLayout(this);

              box.setOrientation(
                      LinearLayout.VERTICAL
              );

              box.setPadding(
                      dp(16),
                      dp(16),
                      dp(16),
                      dp(16)
              );

              box.setBackground(
                      rounded(Color.WHITE, 18)
              );

              LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                              -1,
                              -2
                      );

              p.bottomMargin = dp(14);

              box.setLayoutParams(p);

              return box;
          }

          private TextView label(String value) {

              TextView t =
                      text(
                              value,
                              14,
                              DARK,
                              true
                      );

              t.setPadding(
                      dp(2),
                      dp(10),
                      0,
                      dp(6)
              );

              return t;
          }

          private TextView text(
                  String value,
                  int size,
                  int color,
                  boolean bold
          ) {

              TextView t =
                      new TextView(this);

              t.setText(value);
              t.setTextSize(size);
              t.setTextColor(color);

              if (bold) {

                  t.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );
              }

              return t;
          }

          private Button smallButton(String value) {

              Button b =
                      new Button(this);

              b.setText(value);
              b.setTextSize(20);
              b.setTextColor(WHITE);
              b.setAllCaps(false);

              b.setBackground(
                      rounded(
                              Color.rgb(0, 105, 92),
                              14
                      )
              );

              b.setMinWidth(0);
              b.setMinimumWidth(0);

              return b;
          }

          private LinearLayout.LayoutParams fieldParams() {

              LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(52)
                      );

              p.bottomMargin = dp(5);

              return p;
          }

          private GradientDrawable rounded(
                  int color,
                  int radius
          ) {

              GradientDrawable d =
                      new GradientDrawable();

              d.setColor(color);
              d.setCornerRadius(
                      dp(radius)
              );

              return d;
          }

          private int dp(int value) {

              return (int) (
                      value
                      * getResources()
                              .getDisplayMetrics()
                              .density
              );
          }
          }
          EOF

