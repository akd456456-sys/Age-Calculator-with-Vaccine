name: Tiloi Age Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf app

          mkdir -p app/src/main/java/com/ak/agevaccine
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          if [ ! -f "Tiloi_Age_Calculator_App_Logo_1024x1024.png" ]; then
            echo "ERROR: Logo file not found."
            echo "Required file: Tiloi_Age_Calculator_App_Logo_1024x1024.png"
            exit 1
          fi

          cp "Tiloi_Age_Calculator_App_Logo_1024x1024.png" \
             app/src/main/res/drawable/tiloi_logo.png

      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Tiloi Age Calculator"
          include(":app")
          EOF

      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Create app build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ak.agevaccine'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.ak.agevaccine'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.1'
              implementation 'androidx.activity:activity:1.10.1'
          }
          EOF

      - name: Create colors.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="teal">#00897B</color>
              <color name="teal_dark">#00695C</color>
              <color name="blue">#1565C0</color>
              <color name="white">#FFFFFF</color>
              <color name="text_dark">#17324D</color>
              <color name="background">#F4F8FA</color>
          </resources>
          EOF

      - name: Create themes.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="Theme.TiloiAgeCalculator"
                  parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#00695C</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:colorAccent">#00897B</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

      - name: Create strings.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">तिलौई Age Calculator</string>
          </resources>
          EOF

      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@drawable/tiloi_logo"
                  android:roundIcon="@drawable/tiloi_logo"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.TiloiAgeCalculator">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create MainActivity.java
        shell: bash
        run: |
          cat > app/src/main/java/com/ak/agevaccine/MainActivity.java <<'EOF'
          package com.ak.agevaccine;

          import android.app.DatePickerDialog;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.RadioButton;
          import android.widget.RadioGroup;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends AppCompatActivity {

              private static final int TEAL = Color.rgb(0, 137, 123);
              private static final int DARK = Color.rgb(23, 50, 77);
              private static final int RED = Color.rgb(198, 40, 40);
              private static final int BACKGROUND = Color.rgb(244, 248, 250);

              private Calendar dob;
              private Calendar today = Calendar.getInstance();

              private TextView dobText;
              private TextView todayText;
              private TextView ageText;
              private RadioGroup genderGroup;
              private LinearLayout resultBox;
              private LinearLayout timetableBox;

              private int dp(float v) {
                  return (int) (v *
                          getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView tv(
                      String value,
                      float size,
                      int color,
                      boolean bold) {

                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setTypeface(
                          Typeface.DEFAULT,
                          bold ? Typeface.BOLD : Typeface.NORMAL
                  );
                  t.setPadding(dp(4), dp(5), dp(4), dp(5));
                  return t;
              }

              private LinearLayout card() {

                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(
                          dp(14),
                          dp(12),
                          dp(14),
                          dp(12)
                  );

                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.WHITE);
                  bg.setCornerRadius(dp(15));
                  bg.setStroke(dp(1), Color.rgb(220, 230, 232));

                  c.setBackground(bg);

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -2
                          );

                  p.setMargins(0, dp(7), 0, dp(7));
                  c.setLayoutParams(p);

                  return c;
              }

              private Button mainButton(String text) {

                  Button b = new Button(this);

                  b.setText(text);
                  b.setTextSize(15);
                  b.setTextColor(Color.WHITE);
                  b.setAllCaps(false);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(TEAL);
                  bg.setCornerRadius(dp(10));

                  b.setBackground(bg);

                  return b;
              }

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  buildUI();
              }

              private void buildUI() {

                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(BACKGROUND);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(
                          dp(13),
                          dp(10),
                          dp(13),
                          dp(20)
                  );

                  LinearLayout header = card();
                  header.setPadding(
                          dp(16),
                          dp(15),
                          dp(16),
                          dp(15)
                  );

                  GradientDrawable hb = new GradientDrawable();
                  hb.setColor(TEAL);
                  hb.setCornerRadius(dp(17));
                  header.setBackground(hb);

                  TextView title = tv(
                          "तिलौई Age Calculator",
                          23,
                          Color.WHITE,
                          true
                  );

                  TextView sub = tv(
                          "आयु एवं टीकाकरण कैलकुलेटर",
                          15,
                          Color.WHITE,
                          false
                  );

                  header.addView(title);
                  header.addView(sub);
                  root.addView(header);

                  LinearLayout info = card();

                  info.addView(
                          tv(
                                  "लाभार्थी की जानकारी",
                                  19,
                                  DARK,
                                  true
                          )
                  );

                  dobText = tv(
                          "जन्म तिथि: चयन नहीं की गई",
                          14,
                          DARK,
                          false
                  );

                  Button dobButton =
                          mainButton("📅 जन्म तिथि चुनें");

                  dobButton.setOnClickListener(
                          v -> pickDob()
                  );

                  info.addView(
                          dobButton,
                          new LinearLayout.LayoutParams(-1, dp(50))
                  );

                  info.addView(dobText);

                  todayText = tv(
                          formatDate(today),
                          14,
                          DARK,
                          false
                  );

                  Button todayButton =
                          mainButton("📅 आज की तारीख चुनें");

                  todayButton.setOnClickListener(
                          v -> pickToday()
                  );

                  info.addView(
                          todayButton,
                          new LinearLayout.LayoutParams(-1, dp(50))
                  );

                  info.addView(todayText);

                  info.addView(
                          tv(
                                  "लिंग चुनें",
                                  16,
                                  DARK,
                                  true
                          )
                  );

                  genderGroup = new RadioGroup(this);
                  genderGroup.setOrientation(
                          RadioGroup.HORIZONTAL
                  );
                  genderGroup.setPadding(
                          0,
                          dp(4),
                          0,
                          dp(5)
                  );

                  RadioButton male =
                          genderButton(
                                  "👦 पुरुष (Male)"
                          );

                  RadioButton female =
                          genderButton(
                                  "👧 महिला (Female)"
                          );

                  genderGroup.addView(male);
                  genderGroup.addView(female);

                  male.setChecked(true);

                  info.addView(genderGroup);

                  Button calculate =
                          mainButton(
                                  "🔍 आयु एवं टीकाकरण देखें"
                          );

                  calculate.setOnClickListener(
                          v -> calculate()
                  );

                  info.addView(
                          calculate,
                          new LinearLayout.LayoutParams(-1, dp(52))
                  );

                  root.addView(info);

                  resultBox = new LinearLayout(this);
                  resultBox.setOrientation(
                          LinearLayout.VERTICAL
                  );
                  resultBox.setVisibility(View.GONE);

                  root.addView(resultBox);

                  Button timetable =
                          mainButton(
                                  "📋 टीकाकरण टाइम टेबल देखें"
                          );

                  timetable.setOnClickListener(
                          v -> showTimetable()
                  );

                  root.addView(
                          timetable,
                          new LinearLayout.LayoutParams(-1, dp(52))
                  );

                  timetableBox =
                          new LinearLayout(this);

                  timetableBox.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  timetableBox.setVisibility(
                          View.GONE
                  );

                  root.addView(timetableBox);

                  TextView footer =
                          tv(
                                  "स्वस्थ बच्चा • सुरक्षित भविष्य",
                                  14,
                                  TEAL,
                                  true
                          );

                  footer.setGravity(Gravity.CENTER);
                  footer.setPadding(0, dp(18), 0, dp(5));

                  root.addView(footer);

                  scroll.addView(root);
                  setContentView(scroll);
              }

              private RadioButton genderButton(String text) {

                  RadioButton r =
                          new RadioButton(this);

                  r.setText(text);
                  r.setTextSize(15);
                  r.setTextColor(DARK);
                  r.setButtonTintList(
                          android.content.res.ColorStateList
                                  .valueOf(TEAL)
                  );

                  r.setPadding(
                          dp(8),
                          dp(8),
                          dp(12),
                          dp(8)
                  );

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(52),
                                  1
                          );

                  p.setMargins(
                          dp(2),
                          dp(3),
                          dp(2),
                          dp(3)
                  );

                  r.setLayoutParams(p);

                  return r;
              }

              private void pickDob() {

                  Calendar base =
                          dob == null
                                  ? Calendar.getInstance()
                                  : dob;

                  DatePickerDialog d =
                          new DatePickerDialog(
                                  this,
                                  (view, year, month, day) -> {

                                      dob =
                                              Calendar.getInstance();

                                      dob.set(
                                              year,
                                              month,
                                              day
                                      );

                                      dobText.setText(
                                              "जन्म तिथि: "
                                                      + formatDate(dob)
                                      );
                                  },
                                  base.get(Calendar.YEAR),
                                  base.get(Calendar.MONTH),
                                  base.get(Calendar.DAY_OF_MONTH)
                          );

                  d.getDatePicker().setMaxDate(
                          Calendar.getInstance()
                                  .getTimeInMillis()
                  );

                  d.show();
              }

              private void pickToday() {

                  Calendar initial =
                          Calendar.getInstance();

                  DatePickerDialog d =
                          new DatePickerDialog(
                                  this,
                                  (view, year, month, day) -> {

                                      today =
                                              Calendar.getInstance();

                                      today.set(
                                              year,
                                              month,
                                              day
                                      );

                                      todayText.setText(
                                              "आज की तारीख: "
                                                      + formatDate(today)
                                      );
                                  },
                                  initial.get(Calendar.YEAR),
                                  initial.get(Calendar.MONTH),
                                  initial.get(Calendar.DAY_OF_MONTH)
                          );

                  d.show();
              }

              private String formatDate(Calendar c) {

                  return new SimpleDateFormat(
                          "dd-MM-yyyy",
                          Locale.getDefault()
                  ).format(c.getTime());
              }

              private void calculate() {

                  if (dob == null) {

                      Toast.makeText(
                              this,
                              "कृपया जन्म तिथि चुनें",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  if (dob.after(today)) {

                      Toast.makeText(
                              this,
                              "जन्म तिथि आज से आगे नहीं हो सकती",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }

                  Age age = getAge(dob, today);

                  resultBox.removeAllViews();
                  resultBox.setVisibility(View.VISIBLE);

                  LinearLayout ageCard = card();

                  ageCard.addView(
                          tv(
                                  "वर्तमान आयु",
                                  18,
                                  DARK,
                                  true
                          )
                  );

                  ageText =
                          tv(
                                  age.years + " वर्ष "
                                          + age.months + " माह "
                                          + age.days + " दिन",
                                  25,
                                  TEAL,
                                  true
                          );

                  ageText.setGravity(
                          Gravity.CENTER
                  );

                  ageCard.addView(ageText);

                  ageCard.addView(
                          tv(
                                  "कुल आयु: "
                                          + totalDays(dob, today)
                                          + " दिन",
                                  13,
                                  Color.DKGRAY,
                                  false
                          )
                  );

                  resultBox.addView(ageCard);

                  boolean female =
                          genderGroup.getCheckedRadioButtonId()
                                  == genderGroup
                                  .getChildAt(1)
                                  .getId();

                  List<Vaccine> due =
                          getDueVaccines(age);

                  List<Vaccine> expired =
                          getExpiredVaccines(age);

                  LinearLayout dueCard = card();

                  dueCard.addView(
                          tv(
                                  "💉 अभी देय टीके",
                                  18,
                                  TEAL,
                                  true
                          )
                  );

                  if (due.isEmpty()) {

                      dueCard.addView(
                              tv(
                                      "इस आयु पर कोई टीका देय नहीं है।",
                                      15,
                                      Color.rgb(46, 125, 50),
                                      true
                              )
                      );

                  } else {

                      for (Vaccine v : due) {

                          dueCard.addView(
                                  vaccineRow(
                                          v,
                                          false
                                  )
                          );
                      }
                  }

                  resultBox.addView(dueCard);

                  LinearLayout missedCard = card();

                  missedCard.addView(
                          tv(
                                  "⚠️ छूटे हुए / आगे उपलब्ध टीके",
                                  18,
                                  RED,
                                  true
                          )
                  );

                  if (expired.isEmpty()) {

                      missedCard.addView(
                              tv(
                                      "इस आयु पर कोई टीका maximum age से बाहर नहीं है।",
                                      14,
                                      Color.DKGRAY,
                                      false
                              )
                      );

                  } else {

                      for (Vaccine v : expired) {

                          missedCard.addView(
                                  vaccineRow(
                                          v,
                                          true
                                  )
                          );
                      }
                  }

                  resultBox.addView(missedCard);

                  if (female &&
                          age.totalMonths >= 168 &&
                          age.totalMonths <= 183) {

                      LinearLayout hpv =
                              card();

                      hpv.addView(
                              tv(
                                      "💗 HPV टीका",
                                      18,
                                      Color.rgb(194, 24, 91),
                                      true
                              )
                      );

                      hpv.addView(
                              tv(
                                      "महिला लाभार्थी की आयु "
                                              + age.years
                                              + " वर्ष "
                                              + age.months
                                              + " माह "
                                              + age.days
                                              + " दिन है। आपकी निर्धारित guideline के अनुसार HPV के लिए पात्र है।",
                                      14,
                                      DARK,
                                      false
                              )
                      );

                      hpv.addView(
                              tv(
                                      "HPV: 14 वर्ष से 15 वर्ष 3 माह तक",
                                      15,
                                      Color.rgb(194, 24, 91),
                                      true
                              )
                      );

                      resultBox.addView(hpv);
                  }
              }

              private String totalDays(
                      Calendar from,
                      Calendar to) {

                  long diff =
                          to.getTimeInMillis()
                                  - from.getTimeInMillis();

                  return String.valueOf(
                          diff /
                                  (24L * 60L * 60L * 1000L)
                  );
              }

              private Age getAge(
                      Calendar birth,
                      Calendar end) {

                  Calendar temp =
                          (Calendar) birth.clone();

                  int years = 0;

                  while (true) {

                      Calendar next =
                              (Calendar) temp.clone();

                      next.add(Calendar.YEAR, 1);

                      if (next.after(end)) break;

                      temp = next;
                      years++;
                  }

                  int months = 0;

                  while (true) {

                      Calendar next =
                              (Calendar) temp.clone();

                      next.add(Calendar.MONTH, 1);

                      if (next.after(end)) break;

                      temp = next;
                      months++;
                  }

                  int days =
                          (int)
                                  ((end.getTimeInMillis()
                                          - temp.getTimeInMillis())
                                          /
                                          (24L * 60L * 60L * 1000L));

                  int totalMonths =
                          years * 12 + months;

                  return new Age(
                          years,
                          months,
                          days,
                          totalMonths
                  );
              }

              private List<Vaccine> getDueVaccines(
                      Age age) {

                  List<Vaccine> list =
                          new ArrayList<>();

                  int d = age.totalDaysApprox();

                  addDue(
                          list,
                          "BCG",
                          "जन्म के समय",
                          "1 वर्ष तक",
                          "0.05 / 0.1 ml",
                          "ID",
                          "बांह के ऊपर"
                  );

                  if (d <= 1) {

                      addDue(
                              list,
                              "Hepatitis-B Birth Dose",
                              "जन्म के समय",
                              "जन्म के 24 घंटे के अंदर",
                              "0.5 ml",
                              "IM",
                              "दायां जांघ का आगे-बाहरी भाग"
                      );
                  }

                  if (d <= 14) {

                      addDue(
                              list,
                              "OPV Zero Dose",
                              "जन्म के समय",
                              "14 दिन तक",
                              "2 बूंद",
                              "Oral",
                              "मुंह द्वारा"
                      );
                  }

                  weekDue(
                          list,
                          "Penta-1",
                          6,
                          "1 वर्ष तक",
                          "0.5 ml",
                          "IM",
                          "जांघ का आगे-बाहरी भाग"
                  );

                  weekDue(
                          list,
                          "Penta-2",
                          10,
                          "1 वर्ष तक",
                          "0.5 ml",
                          "IM",
                          "जांघ का आगे-बाहरी भाग"
                  );

                  weekDue(
                          list,
                          "Penta-3",
                          14,
                          "1 वर्ष तक",
                          "0.5 ml",
                          "IM",
                          "जांघ का आगे-बाहरी भाग"
                  );

                  weekDue(
                          list,
                          "OPV-1",
                          6,
                          "5 वर्ष तक",
                          "2 बूंद",
                          "Oral",
                          "मुंह द्वारा"
                  );

                  weekDue(
                          list,
                          "OPV-2",
                          10,
                          "5 वर्ष तक",
                          "2 बूंद",
                          "Oral",
                          "मुंह द्वारा"
                  );

                  weekDue(
                          list,
                          "OPV-3",
                          14,
                          "5 वर्ष तक",
                          "2 बूंद",
                          "Oral",
                          "मुंह द्वारा"
                  );

                  weekDue(
                          list,
                          "fIPV-1",
                          6,
                          "1 वर्ष तक",
                          "0.1 ml",
                          "ID",
                          "दायां बांह"
                  );

                  weekDue(
                          list,
                          "fIPV-2",
                          14,
                          "1 वर्ष तक",
                          "0.1 ml",
                          "ID",
                          "दायां बांह"
                  );

                  addDue(
                          list,
                          "fIPV-3",
                          "9–12 माह",
                          "1 वर्ष तक",
