name: Tiloi Age Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # =========================================================
      # GRADLE
      # =========================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"


      # =========================================================
      # CREATE PROJECT
      # =========================================================

      - name: Create project structure
        shell: bash
        run: |
          set -e

          rm -rf app

          mkdir -p app/src/main/java/com/ak/agevaccine
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          test -f "Tiloi_Age_Calculator_App_Logo_1024x1024.png"

          cp "Tiloi_Age_Calculator_App_Logo_1024x1024.png" \
            app/src/main/res/drawable/tiloi_logo.png


      # =========================================================
      # SETTINGS
      # =========================================================

      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Tiloi Age Calculator"

          include(":app")
          EOF


      # =========================================================
      # ROOT BUILD
      # =========================================================

      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


      # =========================================================
      # GRADLE PROPERTIES
      # =========================================================

      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


      # =========================================================
      # APP BUILD
      # =========================================================

      - name: Create app build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ak.agevaccine'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.ak.agevaccine'

                  minSdk 23
                  targetSdk 35

                  versionCode 5
                  versionName '5.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.1'
              implementation 'androidx.activity:activity:1.10.1'
          }
          EOF


      # =========================================================
      # COLORS
      # =========================================================

      - name: Create colors.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <color name="teal">#00897B</color>
              <color name="teal_dark">#00695C</color>
              <color name="background">#F4F8FA</color>
              <color name="text_dark">#17324D</color>
              <color name="white">#FFFFFF</color>

          </resources>
          EOF


      # =========================================================
      # THEME
      # =========================================================

      - name: Create themes.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="Theme.TiloiAgeCalculator"
                  parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:statusBarColor">#00695C</item>

                  <item name="android:navigationBarColor">#000000</item>

                  <item name="android:colorAccent">#00897B</item>

                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF


      # =========================================================
      # STRINGS
      # =========================================================

      - name: Create strings.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">तिलोई Age Calculator</string>

          </resources>
          EOF


      # =========================================================
      # MANIFEST
      # =========================================================

      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@drawable/tiloi_logo"
                  android:roundIcon="@drawable/tiloi_logo"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.TiloiAgeCalculator">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # =========================================================
      # MAIN ACTIVITY
      # =========================================================

      - name: Create MainActivity.java
        shell: bash
        run: |
          cat > app/src/main/java/com/ak/agevaccine/MainActivity.java <<'EOF'
          package com.ak.agevaccine;

          import android.app.DatePickerDialog;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.RadioButton;
          import android.widget.RadioGroup;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.List;
          import java.util.Locale;


          public class MainActivity extends AppCompatActivity {


              // =====================================================
              // COLORS
              // =====================================================

              private static final int TEAL =
                      Color.rgb(0, 137, 123);

              private static final int DARK =
                      Color.rgb(23, 50, 77);

              private static final int PINK =
                      Color.rgb(194, 24, 91);

              private static final int GREEN =
                      Color.rgb(46, 125, 50);

              private static final int BACKGROUND =
                      Color.rgb(244, 248, 250);


              // =====================================================
              // VARIABLES
              // =====================================================

              private Calendar dob;

              private Calendar today =
                      Calendar.getInstance();

              private TextView dobText;

              private TextView todayText;

              private RadioGroup genderGroup;

              private LinearLayout resultBox;

              private LinearLayout timetableBox;


              // =====================================================
              // DP
              // =====================================================

              private int dp(float value) {

                  return (int) (
                          value *
                                  getResources()
                                          .getDisplayMetrics()
                                          .density
                                  + 0.5f
                  );
              }


              // =====================================================
              // ON CREATE
              // =====================================================

              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(
                          savedInstanceState
                  );

                  buildInterface();
              }


              // =====================================================
              // TEXT
              // =====================================================

              private TextView makeText(
                      String value,
                      float size,
                      int color,
                      boolean bold) {

                  TextView t =
                          new TextView(this);

                  t.setText(value);

                  t.setTextSize(size);

                  t.setTextColor(color);

                  t.setTypeface(
                          Typeface.DEFAULT,
                          bold
                                  ? Typeface.BOLD
                                  : Typeface.NORMAL
                  );

                  t.setPadding(
                          dp(4),
                          dp(5),
                          dp(4),
                          dp(5)
                  );

                  return t;
              }


              // =====================================================
              // CARD
              // =====================================================

              private LinearLayout makeCard() {

                  LinearLayout box =
                          new LinearLayout(this);

                  box.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  box.setPadding(
                          dp(14),
                          dp(12),
                          dp(14),
                          dp(12)
                  );

                  GradientDrawable background =
                          new GradientDrawable();

                  background.setColor(
                          Color.WHITE
                  );

                  background.setCornerRadius(
                          dp(15)
                  );

                  background.setStroke(
                          dp(1),
                          Color.rgb(
                                  220,
                                  230,
                                  232
                          )
                  );

                  box.setBackground(
                          background
                  );

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -2
                          );

                  params.setMargins(
                          0,
                          dp(7),
                          0,
                          dp(7)
                  );

                  box.setLayoutParams(params);

                  return box;
              }


              // =====================================================
              // BUTTON
              // =====================================================

              private Button makeButton(
                      String value) {

                  Button button =
                          new Button(this);

                  button.setText(value);

                  button.setTextSize(15);

                  button.setTextColor(
                          Color.WHITE
                  );

                  button.setAllCaps(false);

                  GradientDrawable background =
                          new GradientDrawable();

                  background.setColor(TEAL);

                  background.setCornerRadius(
                          dp(10)
                  );

                  button.setBackground(
                          background
                  );

                  return button;
              }


              // =====================================================
              // MAIN INTERFACE
              // =====================================================

              private void buildInterface() {

                  ScrollView scroll =
                          new ScrollView(this);

                  scroll.setFillViewport(true);

                  scroll.setBackgroundColor(
                          BACKGROUND
                  );


                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          dp(13),
                          dp(10),
                          dp(13),
                          dp(20)
                  );


                  // HEADER

                  LinearLayout header =
                          makeCard();

                  GradientDrawable headerBackground =
                          new GradientDrawable();

                  headerBackground.setColor(
                          TEAL
                  );

                  headerBackground.setCornerRadius(
                          dp(17)
                  );

                  header.setBackground(
                          headerBackground
                  );

                  header.addView(
                          makeText(
                                  "तिलोई Age Calculator",
                                  23,
                                  Color.WHITE,
                                  true
                          )
                  );

                  header.addView(
                          makeText(
                                  "आयु एवं टीकाकरण कैलकुलेटर",
                                  15,
                                  Color.WHITE,
                                  false
                          )
                  );

                  root.addView(header);


                  // INFORMATION CARD

                  LinearLayout information =
                          makeCard();

                  information.addView(
                          makeText(
                                  "लाभार्थी की जानकारी",
                                  19,
                                  DARK,
                                  true
                          )
                  );


                  // DOB

                  Button dobButton =
                          makeButton(
                                  "📅 जन्म तिथि चुनें"
                          );

                  dobButton.setOnClickListener(
                          v -> pickDob()
                  );

                  information.addView(
                          dobButton,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(50)
                          )
                  );


                  dobText =
                          makeText(
                                  "जन्म तिथि: चयन नहीं की गई",
                                  14,
                                  DARK,
                                  false
                          );

                  information.addView(dobText);


                  // TODAY

                  Button todayButton =
                          makeButton(
                                  "📅 आज की तारीख चुनें"
                          );

                  todayButton.setOnClickListener(
                          v -> pickToday()
                  );

                  information.addView(
                          todayButton,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(50)
                          )
                  );


                  todayText =
                          makeText(
                                  "आज की तारीख: "
                                          + formatDate(today),
                                  14,
                                  DARK,
                                  false
                          );

                  information.addView(
                          todayText
                  );


                  // GENDER

                  information.addView(
                          makeText(
                                  "लिंग चुनें",
                                  16,
                                  DARK,
                                  true
                          )
                  );


                  genderGroup =
                          new RadioGroup(this);

                  genderGroup.setOrientation(
                          RadioGroup.HORIZONTAL
                  );


                  RadioButton male =
                          new RadioButton(this);

                  male.setText(
                          "♂ पुरुष (Male)"
                  );

                  male.setTextSize(15);

                  male.setTextColor(DARK);


                  RadioButton female =
                          new RadioButton(this);

                  female.setText(
                          "♀ महिला (Female)"
                  );

                  female.setTextSize(15);

                  female.setTextColor(DARK);


                  genderGroup.addView(male);

                  genderGroup.addView(female);

                  male.setChecked(true);

                  information.addView(
                          genderGroup
                  );


                  // CALCULATE

                  Button calculate =
                          makeButton(
                                  "🔍 आयु एवं टीकाकरण देखें"
                          );

                  calculate.setOnClickListener(
                          v -> calculate()
                  );

                  information.addView(
                          calculate,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(52)
                          )
                  );


                  root.addView(
                          information
                  );


                  // RESULT

                  resultBox =
                          new LinearLayout(this);

                  resultBox.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  resultBox.setVisibility(
                          View.GONE
                  );

                  root.addView(
                          resultBox
                  );


                  // TIMETABLE BUTTON

                  Button timetableButton =
                          makeButton(
                                  "📋 टीकाकरण टाइम टेबल देखें"
                          );

                  timetableButton.setOnClickListener(
                          v -> showTimetable()
                  );

                  root.addView(
                          timetableButton,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(52)
                          )
                  );


                  timetableBox =
                          new LinearLayout(this);

                  timetableBox.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  timetableBox.setVisibility(
                          View.GONE
                  );

                  root.addView(
                          timetableBox
                  );


                  TextView footer =
                          makeText(
                                  "स्वस्थ बच्चा • सुरक्षित भविष्य",
                                  14,
                                  TEAL,
                                  true
                          );

                  footer.setGravity(
                          Gravity.CENTER
                  );

                  root.addView(footer);


                  scroll.addView(root);

                  setContentView(scroll);
              }


              // =====================================================
              // DOB PICKER
              // =====================================================

              private void pickDob() {

                  Calendar initial =
                          dob == null
                                  ? Calendar.getInstance()
                                  : (Calendar) dob.clone();

                  DatePickerDialog dialog =
                          new DatePickerDialog(
                                  this,
                                  (
                                          view,
                                          year,
                                          month,
                                          day
                                  ) -> {

                                      dob =
                                              Calendar.getInstance();

                                      dob.set(
                                              year,
                                              month,
                                              day,
                                              0,
                                              0,
                                              0
                                      );

                                      dob.set(
                                              Calendar.MILLISECOND,
                                              0
                                      );

                                      dobText.setText(
                                              "जन्म तिथि: "
                                                      + formatDate(dob)
                                      );

                                  },
                                  initial.get(
                                          Calendar.YEAR
                                  ),
                                  initial.get(
                                          Calendar.MONTH
                                  ),
                                  initial.get(
                                          Calendar.DAY_OF_MONTH
                                  )
                          );

                  dialog.getDatePicker()
                          .setMaxDate(
                                  Calendar.getInstance()
                                          .getTimeInMillis()
                          );

                  dialog.show();
              }


              // =====================================================
              // TODAY PICKER
              // =====================================================

              private void pickToday() {

                  Calendar initial =
                          (Calendar) today.clone();

                  DatePickerDialog dialog =
                          new DatePickerDialog(
                                  this,
                                  (
                                          view,
                                          year,
                                          month,
                                          day
                                  ) -> {

                                      today =
                                              Calendar.getInstance();

                                      today.set(
                                              year,
                                              month,
                                              day,
                                              0,
                                              0,
                                              0
                                      );

                                      today.set(
                                              Calendar.MILLISECOND,
                                              0
                                      );

                                      todayText.setText(
                                              "आज की तारीख: "
                                                      + formatDate(today)
                                      );

                                      if (dob != null) {
                                          calculate();
                                      }

                                  },
                                  initial.get(
                                          Calendar.YEAR
                                  ),
                                  initial.get(
                                          Calendar.MONTH
                                  ),
                                  initial.get(
                                          Calendar.DAY_OF_MONTH
                                  )
                          );

                  dialog.getDatePicker()
                          .setMaxDate(
                                  Calendar.getInstance()
                                          .getTimeInMillis()
                          );

                  dialog.show();
              }


              // =====================================================
              // DATE FORMAT
              // =====================================================

              private String formatDate(
                      Calendar date) {

                  return new SimpleDateFormat(
                          "dd-MM-yyyy",
                          Locale.getDefault()
                  ).format(
                          date.getTime()
                  );
              }


              // =====================================================
              // CALCULATE
              // =====================================================

              private void calculate() {

                  if (dob == null) {

                      Toast.makeText(
                              this,
                              "कृपया जन्म तिथि चुनें",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }


                  if (dob.after(today)) {

                      Toast.makeText(
                              this,
                              "जन्म तिथि आज से आगे नहीं हो सकती",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }


                  Age age =
                          getAge(
                                  dob,
                                  today
                          );


                  resultBox.removeAllViews();

                  resultBox.setVisibility(
                          View.VISIBLE
                  );


                  // AGE CARD

                  LinearLayout ageCard =
                          makeCard();

                  ageCard.addView(
                          makeText(
                                  "वर्तमान आयु",
                                  18,
                                  DARK,
                                  true
                          )
                  );


                  TextView ageValue =
                          makeText(
                                  age.years
                                          + " वर्ष "
                                          + age.months
                                          + " माह "
                                          + age.days
                                          + " दिन",
                                  25,
                                  TEAL,
                                  true
                          );

                  ageValue.setGravity(
                          Gravity.CENTER
                  );

                  ageCard.addView(
                          ageValue
                  );

                  resultBox.addView(
                          ageCard
                  );


                  // GENDER

                  boolean female =
                          genderGroup
                                  .getCheckedRadioButtonId()
                                  == genderGroup
                                  .getChildAt(1)
                                  .getId();


                  // DUE VACCINES

                  List<Vaccine> due =
                          getDueVaccines(age);


                  LinearLayout dueCard =
                          makeCard();

                  dueCard.addView(
                          makeText(
                                  "💉 अभी देय / लंबित टीके",
                                  18,
                                  TEAL,
                                  true
                          )
                  );


                  if (due.isEmpty()) {

                      dueCard.addView(
                              makeText(
                                      "इस आयु पर कोई टीका देय नहीं है।",
                                      15,
                                      GREEN,
                                      true
                              )
                      );

                  } else {

                      for (Vaccine vaccine : due) {

                          dueCard.addView(
                                  vaccineRow(
                                          vaccine
                                  )
                          );
                      }
                  }


                  resultBox.addView(
                          dueCard
                  );


                  // HPV

                  if (female &&
                          isHpvEligible()) {

                      LinearLayout hpvCard =
                              makeCard();

                      hpvCard.addView(
                              makeText(
                                      "💗 HPV टीका",
                                      18,
                                      PINK,
                                      true
                              )
                      );

                      hpvCard.addView(
                              makeText(
                                      "महिला लाभार्थी HPV टीके के लिए पात्र है।",
                                      14,
                                      DARK,
                                      false
                              )
                      );

                      hpvCard.addView(
                              makeText(
                                      "पात्रता: 14 वर्ष + 1 दिन से 15 वर्ष 3 माह तक",
                                      14,
                                      PINK,
                                      true
                              )
                      );

                      resultBox.addView(
                              hpvCard
                      );
                  }
              }


              // =====================================================
              // AGE CALCULATION
              // =====================================================

              private Age getAge(
                      Calendar birth,
                      Calendar end) {

                  Calendar temp =
                          (Calendar) birth.clone();

                  int years = 0;


                  while (true) {

                      Calendar next =
                              (Calendar) temp.clone();

                      next.add(
                              Calendar.YEAR,
                              1
                      );

                      if (next.after(end)) {
                          break;
                      }

                      temp = next;

                      years++;
                  }


                  int months = 0;


                  while (true) {

                      Calendar next =
                              (Calendar) temp.clone();

                      next.add(
                              Calendar.MONTH,
                              1
                      );

                      if (next.after(end)) {
                          break;
                      }

                      temp = next;

                      months++;
                  }


                  long difference =
                          end.getTimeInMillis()
                                  - temp.getTimeInMillis();


                  int days =
                          (int) (
                                  difference
                                          / (
                                          24L
                                                  * 60L
                                                  * 60L
                                                  * 1000L
                                  )
                          );


                  long totalDays =
                          (
                                  end.getTimeInMillis()
                                          - birth.getTimeInMillis()
                          )
                                  / (
                                  24L
                                          * 60L
                                          * 60L
                                          * 1000L
                                  );


                  return new Age(
                          years,
                          months,
                          days,
                          totalDays
                  );
              }


              // =====================================================
              // HPV
              // =====================================================

              private boolean isHpvEligible() {

                  Calendar start =
                          (Calendar) dob.clone();

                  start.add(
                          Calendar.YEAR,
                          14
                  );

                  start.add(
                          Calendar.DAY_OF_MONTH,
                          1
                  );


                  Calendar end =
                          (Calendar) dob.clone();

                  end.add(
                          Calendar.YEAR,
                          15
                  );

                  end.add(
                          Calendar.MONTH,
                          3
                  );


                  return !today.before(start)
                          && !today.after(end);
              }


              // =====================================================
              // DUE VACCINES
              // =====================================================

              private List<Vaccine>
              getDueVaccines(Age age) {

                  List<Vaccine> list =
                          new ArrayList<>();


                  long days =
                          age.totalDays;


                  /*
                   * EXACT WEEK LOGIC
                   *
                   * 6 weeks  = 42 completed days
                   * 10 weeks = 70 completed days
                   * 14 weeks = 98 completed days
                   *
                   * 41 days -> NOT DUE
                   * 42 days -> DUE
                   */


                  // -------------------------------------------------
                  // BIRTH VACCINES
                  // -------------------------------------------------

                  addDays(
                          list,
                          "BCG",
                          0,
                          365,
                          "जन्म के समय",
                          "1 वर्ष तक",
