              private LinearLayout vaccineRow(
                      Vaccine vaccine) {

                  LinearLayout box =
                          new LinearLayout(this);

                  box.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  box.setPadding(
                          dp(10),
                          dp(8),
                          dp(10),
                          dp(8)
                  );


                  GradientDrawable background =
                          new GradientDrawable();

                  background.setColor(
                          Color.rgb(
                                  240,
                                  250,
                                  248
                          )
                  );

                  background.setCornerRadius(
                          dp(10)
                  );

                  box.setBackground(
                          background
                  );


                  box.addView(
                          makeText(
                                  "💉 "
                                          + vaccine.name,
                                  16,
                                  TEAL,
                                  true
                          )
                  );


                  box.addView(
                          makeText(
                                  "देय उम्र: "
                                          + vaccine.dueAge
                                          + "\nMaximum age: "
                                          + vaccine.maxAge
                                          + "\nDose: "
                                          + vaccine.dose
                                          + "\nRoute: "
                                          + vaccine.route
                                          + "\nस्थान: "
                                          + vaccine.site,
                                  13,
                                  DARK,
                                  false
                          )
                  );


                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -2
                          );

                  params.setMargins(
                          0,
                          dp(4),
                          0,
                          dp(4)
                  );

                  box.setLayoutParams(
                          params
                  );


                  return box;
              }


