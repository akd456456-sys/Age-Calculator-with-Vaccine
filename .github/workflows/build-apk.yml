              private void addWindow(
                      List<Vaccine> list,
                      String name,
                      int minimumMonths,
                      int maximumMonths,
                      String dueAge,
                      String maxAge,
                      String dose,
                      String route,
                      String site,
                      int currentMonths) {

                  if (currentMonths >= minimumMonths
                          && currentMonths <= maximumMonths) {

                      list.add(
                              new Vaccine(
                                      name,
                                      dueAge,
                                      maxAge,
                                      dose,
                                      route,
                                      site
                              )
                      );
                  }
              }

              private LinearLayout vaccineRow(
                      Vaccine v) {

                  LinearLayout box =
                          new LinearLayout(this);

                  box.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  box.setPadding(
                          dp(10),
                          dp(8),
                          dp(10),
                          dp(8)
                  );

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(
                                  240,
                                  250,
                                  248
                          )
                  );

                  bg.setCornerRadius(
                          dp(10)
                  );

                  box.setBackground(bg);

                  box.addView(
                          text(
                                  "💉 " + v.name,
                                  16,
                                  TEAL,
                                  true
                          )
                  );

                  box.addView(
                          text(
                                  "देय उम्र: " + v.dueAge
                                          + "\nMaximum age: "
                                          + v.maxAge
                                          + "\nDose: " + v.dose
                                          + "\nRoute: " + v.route
                                          + "\nस्थान: " + v.site,
                                  13,
                                  DARK,
                                  false
                          )
                  );

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -2
                          );

                  p.setMargins(
                          0,
                          dp(4),
                          0,
                          dp(4)
                  );

                  box.setLayoutParams(p);

                  return box;
              }

              private void showTimetable() {

                  if (timetableBox
                          .getVisibility()
                          == View.VISIBLE) {

                      timetableBox.setVisibility(
                              View.GONE
                      );

                      return;
                  }

                  timetableBox.removeAllViews();

                  LinearLayout c =
                          card();

                  c.addView(
                          text(
                                  "📋 टीकाकरण टाइम टेबल",
                                  18,
                                  TEAL,
                                  true
                          )
                  );

                  c.addView(
                          text(
                                  "पूरा schedule — भविष्य के टीके भी यहाँ दिखाई देंगे।",
                                  13,
                                  DARK,
                                  false
                          )
                  );

                  for (Vaccine vaccine :
                        timetable()) {

                      c.addView(
                              vaccineRow(
                                      vaccine
                              )
                      );
                  }

                  timetableBox.addView(c);

                  timetableBox.setVisibility(
                          View.VISIBLE
                  );
              }

