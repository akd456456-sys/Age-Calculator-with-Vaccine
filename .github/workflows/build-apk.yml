              static class Age {

                  int years;
                  int months;
                  int days;
                  int totalMonths;

                  Age(
                          int y,
                          int m,
                          int d,
                          int tm) {

                      years = y;
                      months = m;
                      days = d;
                      totalMonths = tm;
                  }

                  int totalDaysApprox() {

                      return years * 365
                              + months * 30
                              + days;
                  }
              }

              static class Vaccine {

                  String name;
                  String age;
                  String maxAge;
                  String dose;
                  String route;
                  String site;

                  Vaccine(
                          String n,
                          String a,
                          String m,
                          String d,
                          String r,
                          String s) {

                      name = n;
                      age = a;
                      maxAge = m;
                      dose = d;
                      route = r;
                      site = s;
                  }
              }
          }
