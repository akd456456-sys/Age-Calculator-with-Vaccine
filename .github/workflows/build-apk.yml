name: Age Calculator with Vaccine

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # =========================================================
      # GRADLE
      # =========================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"


      # =========================================================
      # CREATE PROJECT STRUCTURE
      # =========================================================

      - name: Create project folders
        shell: bash
        run: |
          set -e

          rm -rf app

          mkdir -p app/src/main/java/com/ak/agevaccine
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values


      # =========================================================
      # SETTINGS.GRADLE
      # =========================================================

      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Age Calculator with Vaccine"

          include(":app")
          EOF


      # =========================================================
      # ROOT BUILD.GRADLE
      # =========================================================

      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


      # =========================================================
      # GRADLE PROPERTIES
      # =========================================================

      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


      # =========================================================
      # APP BUILD.GRADLE
      # =========================================================

      - name: Create app build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ak.agevaccine'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.ak.agevaccine'

                  minSdk 23
                  targetSdk 35

                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {

                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.1'
              implementation 'androidx.activity:activity:1.10.1'
          }
          EOF


      # =========================================================
      # COLORS
      # =========================================================

      - name: Create colors.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <color name="teal">#00897B</color>

              <color name="teal_dark">#00695C</color>

              <color name="blue">#1565C0</color>

              <color name="white">#FFFFFF</color>

              <color name="text_dark">#17324D</color>

              <color name="background">#F4F8FA</color>

          </resources>
          EOF


      # =========================================================
      # THEME
      # =========================================================

      - name: Create themes.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="Theme.AgeVaccine"
                  parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowLightStatusBar">false</item>

                  <item name="android:statusBarColor">#00695C</item>

                  <item name="android:navigationBarColor">#000000</item>

                  <item name="android:colorAccent">#00897B</item>

              </style>

          </resources>
          EOF


      # =========================================================
      # STRINGS
      # =========================================================

      - name: Create strings.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">आयु एवं टीकाकरण कैलकुलेटर</string>

          </resources>
          EOF


      # =========================================================
      # APP ICON
      # =========================================================

      - name: Create application icon
        shell: bash
        run: |
          cat > app/src/main/res/drawable/ic_app.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#00897B"
                  android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M28,51h52v8h-52z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M50,29h8v52h-8z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M38,70c7,-10 25,-10 32,0v8h-32z" />

          </vector>
          EOF


      # =========================================================
      # ANDROID MANIFEST
      # =========================================================

      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_app"
                  android:roundIcon="@drawable/ic_app"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AgeVaccine">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # =========================================================
      # MAIN ACTIVITY
      # =========================================================

      - name: Create MainActivity.java
        shell: bash
        run: |
          cat > app/src/main/java/com/ak/agevaccine/MainActivity.java <<'EOF'
          package com.ak.agevaccine;

          import android.app.DatePickerDialog;
          import android.app.Dialog;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.DatePicker;
          import android.widget.LinearLayout;
          import android.widget.RadioButton;
          import android.widget.RadioGroup;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.List;
          import java.util.Locale;


          public class MainActivity extends AppCompatActivity {


              private static final int TEAL =
                      Color.rgb(0, 137, 123);

              private static final int DARK =
                      Color.rgb(23, 50, 77);

              private static final int BACKGROUND =
                      Color.rgb(244, 248, 250);


              private Calendar dob;

              private Calendar today =
                      Calendar.getInstance();


              private TextView dobText;

              private TextView todayText;

              private RadioGroup genderGroup;

              private LinearLayout resultBox;


              // =====================================================
              // DP
              // =====================================================

              private int dp(float value) {

                  return (int)
                          (value *
                                  getResources()
                                      .getDisplayMetrics()
                                      .density
                                  + 0.5f);
              }


              // =====================================================
              // ON CREATE
              // =====================================================

              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  buildInterface();
              }


              // =====================================================
              // TEXT
              // =====================================================

              private TextView text(
                      String value,
                      float size,
                      int color,
                      boolean bold) {

                  TextView t =
                          new TextView(this);

                  t.setText(value);

                  t.setTextSize(size);

                  t.setTextColor(color);

                  t.setTypeface(
                          Typeface.DEFAULT,
                          bold
                                  ? Typeface.BOLD
                                  : Typeface.NORMAL
                  );

                  t.setPadding(
                          dp(4),
                          dp(4),
                          dp(4),
                          dp(4)
                  );

                  return t;
              }


              // =====================================================
              // BUTTON
              // =====================================================

              private Button button(
                      String value) {

                  Button b =
                          new Button(this);

                  b.setText(value);

                  b.setTextSize(15);

                  b.setTextColor(Color.WHITE);

                  b.setAllCaps(false);

                  b.setBackgroundColor(TEAL);

                  return b;
              }


              // =====================================================
              // CARD
              // =====================================================

              private LinearLayout card() {

                  LinearLayout c =
                          new LinearLayout(this);

                  c.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  c.setPadding(
                          dp(14),
                          dp(12),
                          dp(14),
                          dp(12)
                  );

                  android.graphics.drawable
                          .GradientDrawable bg =
                          new android.graphics.drawable
                                  .GradientDrawable();

                  bg.setColor(Color.WHITE);

                  bg.setCornerRadius(
                          dp(14)
                  );

                  bg.setStroke(
                          dp(1),
                          Color.rgb(
                                  220,
                                  230,
                                  232
                          )
                  );

                  c.setBackground(bg);

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );

                  p.setMargins(
                          0,
                          dp(8),
                          0,
                          dp(8)
                  );

                  c.setLayoutParams(p);

                  return c;
              }


              // =====================================================
              // MAIN INTERFACE
              // =====================================================

              private void buildInterface() {

                  ScrollView scroll =
                          new ScrollView(this);

                  scroll.setFillViewport(true);

                  scroll.setBackgroundColor(
                          BACKGROUND
                  );


                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          dp(14),
                          dp(10),
                          dp(14),
                          dp(18)
                  );


                  // HEADER
                  LinearLayout header =
                          new LinearLayout(this);

                  header.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  header.setPadding(
                          dp(16),
                          dp(18),
                          dp(16),
                          dp(18)
                  );


                  android.graphics.drawable
                          .GradientDrawable headerBg =
                          new android.graphics.drawable
                                  .GradientDrawable();

                  headerBg.setColor(TEAL);

                  headerBg.setCornerRadius(
                          dp(18)
                  );

                  header.setBackground(
                          headerBg
                  );


                  TextView title =
                          text(
                                  "आयु एवं टीकाकरण कैलकुलेटर",
                                  22,
                                  Color.WHITE,
                                  true
                          );


                  TextView subtitle =
                          text(
                                  "Age Calculator • Routine Immunization",
                                  13,
                                  Color.WHITE,
                                  false
                          );


                  header.addView(title);

                  header.addView(subtitle);

                  root.addView(header);


                  // =================================================
                  // INFORMATION CARD
                  // =================================================

                  LinearLayout info =
                          card();


                  info.addView(
                          text(
                                  "लाभार्थी की जानकारी",
                                  18,
                                  DARK,
                                  true
                          )
                  );


                  // DOB BUTTON
                  Button dobButton =
                          button(
                                  "📅  जन्म तिथि चुनें"
                          );


                  dobButton.setOnClickListener(
                          v -> pickDob()
                  );


                  info.addView(
                          dobButton,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(48)
                          )
                  );


                  dobText =
                          text(
                                  "जन्म तिथि नहीं चुनी गई",
                                  14,
                                  Color.DKGRAY,
                                  false
                          );


                  info.addView(dobText);


                  // TODAY BUTTON
                  Button todayButton =
                          button(
                                  "📅  आज की तारीख चुनें"
                          );


                  todayButton.setOnClickListener(
                          v -> pickToday()
                  );


                  info.addView(
                          todayButton,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(48)
                          )
                  );


                  todayText =
                          text(
                                  "",
                                  14,
                                  Color.DKGRAY,
                                  false
                          );


                  info.addView(todayText);


                  // GENDER
                  info.addView(
                          text(
                                  "लिंग",
                                  16,
                                  DARK,
                                  true
                          )
                  );


                  genderGroup =
                          new RadioGroup(this);

                  genderGroup.setOrientation(
                          RadioGroup.HORIZONTAL
                  );


                  RadioButton male =
                          new RadioButton(this);

                  male.setText(
                          "पुरुष / बालक"
                  );

                  male.setTextSize(15);

                  male.setId(
                          View.generateViewId()
                  );

                  male.setChecked(true);


                  RadioButton female =
                          new RadioButton(this);

                  female.setText(
                          "महिला / बालिका"
                  );

                  female.setTextSize(15);

                  female.setId(
                          View.generateViewId()
                  );


                  genderGroup.addView(male);

                  genderGroup.addView(female);

                  info.addView(genderGroup);


                  // CALCULATE
                  Button calculate =
                          button(
                                  "आयु और Due Vaccines देखें"
                          );


                  calculate.setOnClickListener(
                          v -> calculateAndShow()
                  );


                  info.addView(
                          calculate,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(52)
                          )
                  );


                  root.addView(info);


                  // RESULT
                  resultBox =
                          new LinearLayout(this);

                  resultBox.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.addView(resultBox);


                  // TIMETABLE
                  Button timetable =
                          button(
                                  "📋  टीकाकरण टाइम-टेबल / जानकारी"
                          );


                  timetable.setOnClickListener(
                          v -> showTimetable()
                  );


                  root.addView(
                          timetable,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(52)
                          )
                  );


                  TextView note =
                          text(
                                  "नोट: Due सूची आयु के आधार पर संभावित due vaccines दिखाती है। वास्तविक vaccination history तथा स्थानीय/सरकारी guideline के अनुसार स्वास्थ्यकर्मी अंतिम निर्णय लें।",
                                  12,
                                  Color.GRAY,
                                  false
                          );


                  note.setPadding(
                          dp(6),
                          dp(14),
                          dp(6),
                          dp(8)
                  );


                  root.addView(note);


                  scroll.addView(root);

                  setContentView(scroll);


                  todayText.setText(
                          "आज: " + format(today)
                  );
              }


              // =====================================================
              // DOB PICKER
              // =====================================================

              private void pickDob() {

                  Calendar initial =
                          dob == null
                                  ? Calendar.getInstance()
                                  : dob;


                  DatePickerDialog dialog =
                          new DatePickerDialog(
                                  this,
                                  (
                                          DatePicker view,
                                          int year,
                                          int month,
                                          int day
                                  ) -> {

                                      dob =
                                              Calendar.getInstance();

                                      dob.set(
                                              year,
                                              month,
                                              day,
                                              0,
                                              0,
                                              0
                                      );

                                      dob.set(
                                              Calendar.MILLISECOND,
                                              0
                                      );


                                      dobText.setText(
                                              "जन्म तिथि: "
                                                      + format(dob)
                                      );
                                  },

                                  initial.get(
                                          Calendar.YEAR
                                  ),

                                  initial.get(
                                          Calendar.MONTH
                                  ),

                                  initial.get(
                                          Calendar.DAY_OF_MONTH
                                  )
                          );


                  dialog.getDatePicker()
                          .setMaxDate(
                                  System.currentTimeMillis()
                          );


                  dialog.show();
              }


              // =====================================================
              // TODAY PICKER
              // =====================================================

              private void pickToday() {

                  Calendar initial =
                          today;


                  DatePickerDialog dialog =
                          new DatePickerDialog(
                                  this,
                                  (
                                          DatePicker view,
                                          int year,
                                          int month,
                                          int day
                                  ) -> {

                                      today =
                                              Calendar.getInstance();

                                      today.set(
                                              year,
                                              month,
                                              day,
                                              0,
                                              0,
                                              0
                                      );

                                      today.set(
                                              Calendar.MILLISECOND,
                                              0
                                      );


                                      todayText.setText(
                                              "आज की तारीख: "
                                                      + format(today)
                                      );
                                  },

                                  initial.get(
                                          Calendar.YEAR
                                  ),

                                  initial.get(
                                          Calendar.MONTH
                                  ),

                                  initial.get(
                                          Calendar.DAY_OF_MONTH
                                  )
                          );


                  dialog.getDatePicker()
                          .setMaxDate(
                                  System.currentTimeMillis()
                          );


                  dialog.show();
              }


              // =====================================================
              // DATE FORMAT
              // =====================================================

              private String format(
                      Calendar c) {

                  return new SimpleDateFormat(
                          "dd-MM-yyyy",
                          Locale.getDefault()
                  ).format(
                          c.getTime()
                  );
              }


              // =====================================================
              // ADD AGE
              // =====================================================

              private Calendar addAge(
                      Calendar base,
                      int years,
                      int months,
                      int days) {

                  Calendar c =
                          (Calendar)
                                  base.clone();

                  c.add(
                          Calendar.YEAR,
                          years
                  );

                  c.add(
                          Calendar.MONTH,
                          months
                  );

                  c.add(
                          Calendar.DAY_OF_MONTH,
                          days
                  );

                  return c;
              }


              // =====================================================
              // AGE CALCULATION
              // =====================================================

              private String ageText(
                      Calendar birth,
                      Calendar asOf) {

                  if (asOf.before(birth)) {

                      return "अमान्य तारीख";
                  }


                  int years = 0;

                  int months = 0;


                  while (
                          !addAge(
                                  birth,
                                  years + 1,
                                  0,
                                  0
                          ).after(asOf)
                  ) {

                      years++;
                  }


                  Calendar temp =
                          addAge(
                                  birth,
                                  years,
                                  0,
                                  0
                          );


                  while (
                          !addAge(
                                  temp,
                                  0,
                                  months + 1,
                                  0
                          ).after(asOf)
                  ) {

                      months++;
                  }


                  temp =
                          addAge(
                                  temp,
                                  0,
                                  months,
                                  0
                          );


                  long millis =
                          asOf.getTimeInMillis()
                                  -
                                  temp.getTimeInMillis();


                  int days =
                          (int)
                                  (
                                          millis
                                                  /
                                                  (
                                                          24L
                                                                  *
                                                                  60L
                                                                  *
                                                                  60L
                                                                  *
                                                                  1000L
                                                  )
                                  );


                  return
                          years
                                  + " वर्ष "
                                  + months
                                  + " माह "
                                  + days
                                  + " दिन";
              }


              // =====================================================
              // GENDER
              // =====================================================

              private boolean isFemale() {

                  int id =
                          genderGroup
                                  .getCheckedRadioButtonId();


                  RadioButton selected =
                          findViewById(id);


                  if (selected == null) {

                      return false;
                  }


                  return selected
                          .getText()
                          .toString()
                          .contains("महिला");
              }


              // =====================================================
              // AGE THRESHOLD
              // =====================================================

              private boolean reached(
                      int years,
                      int months,
                      int days) {

                  return !today.before(
                          addAge(
                                  dob,
                                  years,
                                  months,
                                  days
                          )
                  );
              }


              // =====================================================
              // BEFORE MAX AGE
              // =====================================================

              private boolean beforeLimit(
                      int years,
                      int months,
                      int days) {

                  return today.before(
                          addAge(
                                  dob,
                                  years,
                                  months,
                                  days
                          )
                  );
              }


              // =====================================================
              // CALCULATE
              // =====================================================

              private void calculateAndShow() {

                  if (dob == null) {

                      Toast.makeText(
                              this,
                              "पहले जन्म तिथि चुनें",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }


                  if (today.before(dob)) {

                      Toast.makeText(
                              this,
                              "आज की तारीख जन्म तिथि से पहले नहीं हो सकती",
                              Toast.LENGTH_SHORT
                      ).show();

                      return;
                  }


                  resultBox.removeAllViews();


                  // AGE CARD
                  LinearLayout ageCard =
                          card();


                  ageCard.addView(
                          text(
                                  "आयु",
                                  18,
                                  DARK,
                                  true
                          )
                  );


                  ageCard.addView(
                          text(
                                  ageText(
                                          dob,
                                          today
                                  ),
                                  24,
                                  TEAL,
                                  true
                          )
                  );


                  ageCard.addView(
                          text(
                                  "गणना की तारीख: "
                                          + format(today),
                                  13,
                                  Color.GRAY,
                                  false
                          )
                  );


                  resultBox.addView(ageCard);


                  // DUE CARD
                  LinearLayout dueCard =
                          card();


                  dueCard.addView(
                          text(
                                  "💉 संभावित Due Vaccines",
                                  18,
                                  DARK,
                                  true
                          )
                  );


                  List<String> due =
                          getDueVaccines();


                  if (due.isEmpty()) {

                      dueCard.addView(
                              text(
                                      "इस आयु पर कोई vaccine due नहीं मिली।",
                                      15,
                                      Color.DKGRAY,
                                      false
                              )
                      );

                  } else {

                      for (String item : due) {

                          TextView row =
                                  text(
                                          "• " + item,
                                          14,
                                          Color.rgb(
                                                  40,
                                                  70,
                                                  75
                                          ),
                                          false
                                  );


                          row.setPadding(
                                  dp(4),
                                  dp(7),
                                  dp(4),
                                  dp(7)
                          );


                          dueCard.addView(row);
                      }
                  }


                  resultBox.addView(dueCard);
              }


              // =====================================================
              // DUE VACCINES
              // =====================================================

              private List<String>
              getDueVaccines() {

                  List<String> list =
                          new ArrayList<>();


                  // BIRTH
                  if (
                          reached(0, 0, 0)
                                  &&
                          beforeLimit(0, 0, 1)
                  ) {

                      list.add(
                              "जन्म पर: BCG — 0.05/0.1 ml — Intradermal — बायाँ ऊपरी बांह"
                      );


                      list.add(
                              "जन्म पर: Hepatitis-B Birth Dose — 0.5 ml — IM — जांघ का anterolateral भाग"
                      );


                      list.add(
                              "जन्म/पहले 15 दिन: OPV-0 — 2 drops — Oral"
                      );
                  }


                  // 6 WEEKS
                  if (
                          reached(0, 1, 14)
                                  &&
                          beforeLimit(1, 0, 0)
                  ) {

                      list.add(
                              "6 सप्ताह: OPV-1"
                      );

                      list.add(
                              "6 सप्ताह: Pentavalent-1"
                      );

                      list.add(
                              "6 सप्ताह: RVV-1"
                      );

                      list.add(
                              "6 सप्ताह: fIPV-1"
                      );

                      list.add(
                              "6 सप्ताह: PCV-1"
                      );
                  }


                  // 10 WEEKS
                  if (
                          reached(0, 2, 14)
                                  &&
                          beforeLimit(1, 0, 0)
                  ) {

                      list.add(
                              "10 सप्ताह: OPV-2"
                      );

                      list.add(
                              "10 सप्ताह: Pentavalent-2"
                      );

                      list.add(
                              "10 सप्ताह: RVV-2"
                      );
                  }


                  // 14 WEEKS
                  if (
                          reached(0, 3, 14)
                                  &&
                          beforeLimit(1, 0, 0)
                  ) {

                      list.add(
                              "14 सप्ताह: OPV-3"
                      );

                      list.add(
                              "14 सप्ताह: Pentavalent-3"
                      );

                      list.add(
                              "14 सप्ताह: RVV-3"
                      );

                      list.add(
                              "14 सप्ताह: fIPV-2"
                      );

                      list.add(
                              "14 सप्ताह: PCV-2"
                      );
                  }


                  // 9-12 MONTHS
                  if (
                          reached(0, 9, 0)
                                  &&
                          beforeLimit(1, 0, 0)
                  ) {

                      list.add(
                              "9–12 माह: MR-1"
                      );

                      list.add(
                              "9–12 माह: PCV Booster"
                      );

                      list.add(
                              "9–12 माह: JE-1*"
                      );

                      list.add(
                              "9 माह: Vitamin-A 1st dose"
                      );
                  }


                  // 16-24 MONTHS
                  if (
                          reached(1, 4, 0)
                                  &&
                          beforeLimit(2, 0, 0)
                  ) {

                      list.add(
                              "16–24 माह: MR-2"
                      );

                      list.add(
                              "16–24 माह: DPT Booster-1"
                      );

                      list.add(
                              "16–24 माह: OPV Booster"
                      );

                      list.add(
                              "16–24 माह: JE-2*"
                      );

                      list.add(
                              "16–24 माह: Vitamin-A"
                      );
                  }


                  // 5-6 YEARS
                  if (
                          reached(5, 0, 0)
                                  &&
                          beforeLimit(6, 0, 0)
                  ) {

                      list.add(
                              "5–6 वर्ष: DPT Booster-2"
                      );
                  }


                  // 10 YEARS
                  if (
                          reached(10, 0, 0)
                                  &&
                          beforeLimit(10, 6, 0)
                  ) {

                      list.add(
                              "10 वर्ष: Td"
                      );
                  }


                  // 16 YEARS
                  if (
                          reached(16, 0, 0)
                                  &&
                          beforeLimit(16, 6, 0)
                  ) {

                      list.add(
                              "16 वर्ष: Td"
                      );
                  }


                  // =================================================
                  // HPV — USER SPECIFIC RULE
                  // 14 YEARS + 1 DAY TO 15 YEARS 3 MONTHS
                  // =================================================

                  if (isFemale()) {

                      Calendar hpvStart =
                              addAge(
                                      dob,
                                      14,
                                      0,
                                      1
                              );


                      Calendar hpvEnd =
                              addAge(
                                      dob,
                                      15,
                                      3,
                                      0
                              );


                      if (
                              !today.before(
                                      hpvStart
                              )
                                      &&
                              !today.after(
                                      hpvEnd
                              )
                      ) {

                          list.add(
                                  "HPV — आपकी दी गई guideline के अनुसार: 14 वर्ष + 1 दिन से 15 वर्ष 3 माह तक — बालिका के लिए Due"
                          );
                      }
                  }


                  return list;
              }


