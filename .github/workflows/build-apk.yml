          public class MainActivity extends AppCompatActivity {

              private static final int TEAL = Color.rgb(0, 137, 123);
              private static final int DARK = Color.rgb(23, 50, 77);
              private static final int PINK = Color.rgb(194, 24, 91);
              private static final int BG = Color.rgb(244, 248, 250);

