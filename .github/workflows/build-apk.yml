              private void pickDob() {

                  Calendar initial =
                          dob == null
                                  ? Calendar.getInstance()
                                  : (Calendar) dob.clone();

                  DatePickerDialog dialog =
                          new DatePickerDialog(
                                  this,
                                  (view, year, month, day) -> {

                                      dob =
                                              Calendar.getInstance();

                                      dob.set(
                                              year,
                                              month,
                                              day,
                                              0,
                                              0,
                                              0
                                      );

                                      dob.set(
                                              Calendar.MILLISECOND,
                                              0
                                      );

                                      dobText.setText(
                                              "जन्म तिथि: "
                                                      + formatDate(dob)
                                      );
                                  },
                                  initial.get(
                                          Calendar.YEAR
                                  ),
                                  initial.get(
                                          Calendar.MONTH
                                  ),
                                  initial.get(
                                          Calendar.DAY_OF_MONTH
                                  )
                          );

                  dialog.getDatePicker()
                          .setMaxDate(
                                  Calendar.getInstance()
                                          .getTimeInMillis()
                          );

                  dialog.show();
              }

              private void pickToday() {

                  Calendar initial =
                          (Calendar) today.clone();

                  DatePickerDialog dialog =
                          new DatePickerDialog(
                                  this,
                                  (view, year, month, day) -> {

                                      today =
                                              Calendar.getInstance();

                                      today.set(
                                              year,
